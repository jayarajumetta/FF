# Canonical manual and Development-scheduled SFP entry point during cutover.
trigger: none
pr: none

schedules:
  - cron: "0 6 * * *"
    displayName: "Midnight Central - Full Suite"
    branches:
      include:
        - Development
    always: true
  - cron: "0 17 * * *"
    displayName: "11:00 AM Central - Full Suite"
    branches:
      include:
        - Development
    always: true

parameters:
  - name: debugModeBasic
    displayName: "Debug Mode: BasicPolicy"
    type: boolean
    default: false
  - name: debugModeCE
    displayName: "Debug Mode: CE"
    type: boolean
    default: false
  - name: suiteToRun
    displayName: "Suite to Run"
    type: string
    default: All
    values:
      - All
      - BasicPolicy Only
      - CE Only
  - name: setupDataPoolService
    displayName: "[One-time] Install DataPool as Windows Service"
    type: boolean
    default: false
  - name: testPlanPublishMode
    displayName: "Azure Test Plans publication"
    type: string
    default: Off
    values:
      - Off
      - Dry-Run
      - Publish
  - name: testPlanMappingSecureFile
    displayName: "Azure Test Plans mapping secure-file name"
    type: string
    default: ""

pool:
  name: Playwright

stages:
  - template: templates/build-package-stage.yml

  - template: templates/setup-datapool-stage.yml
    parameters:
      enabled: ${{ parameters.setupDataPoolService }}

  - template: templates/test-shards-stage.yml
    parameters:
      dependsOn:
        - BuildPackage
        - SetupDataPool
      condition: and(succeeded('BuildPackage'), in(dependencies.SetupDataPool.result, 'Succeeded', 'Skipped'))
      maxParallel: 2
      testPlanPublishMode: ${{ parameters.testPlanPublishMode }}
      testPlanMappingSecureFile: ${{ parameters.testPlanMappingSecureFile }}
      matrix:
        ${{ if ne(parameters.suiteToRun, 'CE Only') }}:
          Basic1:
            SHARD_ID: Basic1
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
          Basic2:
            SHARD_ID: Basic2
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
          Basic3:
            SHARD_ID: Basic3
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
          BasicMisc:
            SHARD_ID: BasicMisc
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
        ${{ if ne(parameters.suiteToRun, 'BasicPolicy Only') }}:
          CE4:
            SHARD_ID: CE4
            DEBUG_MODE: ${{ parameters.debugModeCE }}
          CE5:
            SHARD_ID: CE5
            DEBUG_MODE: ${{ parameters.debugModeCE }}
          CE6:
            SHARD_ID: CE6
            DEBUG_MODE: ${{ parameters.debugModeCE }}

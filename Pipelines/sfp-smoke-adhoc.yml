# Pipeline: SFP Smoke — .NET Playwright (Reqnroll + NUnit)
# Trigger: Manual + Scheduled (Midnight & 11 AM Central)

trigger: none
pr: none

# Cron times are UTC. Central Time offsets:
#   CST (UTC-6): midnight CST = 06:00 UTC | 11:00 AM CST = 17:00 UTC
#   CDT (UTC-5): midnight CDT = 05:00 UTC | 11:00 AM CDT = 16:00 UTC
# Using CST (UTC-6) — adjust in summer if needed.
schedules:
- cron: "0 6 * * *"
  displayName: "Midnight Central — Full Suite"
  branches:
    include:
    - Development
  always: true
- cron: "0 17 * * *"
  displayName: "11:00 AM Central — Full Suite"
  branches:
    include:
    - Development
  always: true

# ── Queue-time parameters ──────────────────────────────────────────────────────
# These appear as a checkbox in the Run Pipeline dialog.
# debugModeBasic=true → BasicPolicy: 1 test per shard (AL, MS, OH) — quick sanity check
# debugModeCE=true    → CE: 1 test per shard (AL, MS, OH) — quick sanity check
parameters:
- name: debugModeBasic
  displayName: "Debug Mode: BasicPolicy (1 test per shard)"
  type: boolean
  default: false
- name: debugModeCE
  displayName: "Debug Mode: CE (1 test per shard)"
  type: boolean
  default: false
- name: suiteToRun
  displayName: "Suite to Run"
  type: string
  default: All
  values:
  - All
  - BasicPolicy Only
  - CE Only
- name: setupDataPoolService
  displayName: "[One-time] Install DataPool as Windows Service on scpw-pnc-plw1"
  type: boolean
  default: false

pool:
  name: "Playwright"

variables:
  DOTNET_VERSION: "8.x"
  BUILD_CONFIGURATION: "Release"
  NUGET_PACKAGES: "$(Pipeline.Workspace)/.nuget/packages"

# ── Stage 0: DataPool Service Setup (one-time, opt-in) ──────────────────────────
stages:
- stage: SetupDataPool
  displayName: "[One-time] Install DataPool Service on scpw-pnc-plw1"
  condition: eq('${{ parameters.setupDataPoolService }}', true)

  pool:
    name: "Playwright"
    demands:
      - Agent.Name -equals scpw-pnc-plw1

  jobs:
  - job: Setup
    displayName: "Install DataPool as Windows Service"
    timeoutInMinutes: 10
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: "Install .NET SDK"
      inputs:
        packageType: sdk
        version: $(DOTNET_VERSION)

    - script: dotnet publish DataPool\DataPool.csproj -c Release -o C:\Services\DataPool
      displayName: "Publish DataPool"

    - powershell: |
        $svc = Get-Service -Name "DataPool" -ErrorAction SilentlyContinue
        if ($svc) {
            sc.exe stop DataPool | Out-Null
            Start-Sleep -Seconds 3
            sc.exe delete DataPool | Out-Null
            Start-Sleep -Seconds 2
        }
        sc.exe create DataPool `
            binPath= "dotnet C:\Services\DataPool\DataPool.dll --urls http://0.0.0.0:5100" `
            start= auto `
            DisplayName= "PnC DataPool"
        sc.exe start DataPool
      displayName: "Register and Start Service"

    - powershell: |
        Write-Host "Waiting for DataPool..."
        $ready = $false
        for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep -Seconds 5
            try {
                $r = Invoke-RestMethod http://localhost:5100/api/quotes -TimeoutSec 3
                Write-Host "DataPool up. Quote count: $($r.Count)"
                $ready = $true
                break
            } catch { Write-Host "Not ready yet ($i)..." }
        }
        if (-not $ready) { Write-Error "DataPool did not start."; exit 1 }

        $dataDir = "C:\Services\DataPool\data"
        New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
        Copy-Item "$(Build.SourcesDirectory)\DataPool\data\quotes.json" "$dataDir\quotes.json" -Force
        sc.exe stop DataPool | Out-Null; Start-Sleep -Seconds 3; sc.exe start DataPool | Out-Null
        Start-Sleep -Seconds 5
        $r = Invoke-RestMethod http://localhost:5100/api/quotes -TimeoutSec 5
        Write-Host "Done. DataPool ready with $($r.Count) quotes."
      displayName: "Verify and Seed Quotes"

# ── Stage 1: Build ─────────────────────────────────────────────────────────────
- stage: Build
  displayName: "Build"
  dependsOn: SetupDataPool
  condition: in(dependencies.SetupDataPool.result, 'Succeeded', 'Skipped')

  jobs:
  - job: Build
    displayName: "Restore, Build & Publish Artifact"
    timeoutInMinutes: 20

    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: "Install .NET SDK $(DOTNET_VERSION)"
      inputs:
        packageType: sdk
        version: $(DOTNET_VERSION)

    - task: Cache@2
      displayName: "Cache NuGet packages"
      inputs:
        key: 'nuget | "$(Agent.OS)" | TestAutomation.csproj'
        restoreKeys: |
          nuget | "$(Agent.OS)"
        path: "$(NUGET_PACKAGES)"

    - script: dotnet restore TestAutomation.csproj
      displayName: "Restore NuGet packages"
      env:
        NUGET_PACKAGES: $(NUGET_PACKAGES)

    - script: dotnet build TestAutomation.csproj --configuration $(BUILD_CONFIGURATION) --no-restore
      displayName: "Build project"

    - powershell: |
        $playwright = Get-ChildItem -Recurse -Filter playwright.ps1 | Select-Object -First 1
        if (-not $playwright) {
            Write-Error "playwright.ps1 not found"
            exit 1
        }

        # Resolve the expected browsers path (default: %LOCALAPPDATA%\ms-playwright)
        $browsersRoot = if ($env:PLAYWRIGHT_BROWSERS_PATH) {
            $env:PLAYWRIGHT_BROWSERS_PATH
        } else {
            Join-Path $env:LOCALAPPDATA "ms-playwright"
        }

        $chromiumInstalled = Test-Path (Join-Path $browsersRoot "chromium-*")
        if ($chromiumInstalled) {
            Write-Host "Chromium already present at '$browsersRoot' — skipping download."
        } else {
            Write-Host "Installing Playwright via $($playwright.FullName)"
            & powershell -File $playwright.FullName install chromium --with-deps
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
      displayName: "Install Playwright Chromium"

    - task: PublishPipelineArtifact@1
      displayName: "Publish Build Output"
      inputs:
        targetPath: "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0"
        artifact: "BuildOutput"

    - task: PublishPipelineArtifact@1
      displayName: "Publish DataPool Output"
      inputs:
        targetPath: "$(Build.SourcesDirectory)/DataPool/bin/$(BUILD_CONFIGURATION)/net8.0"
        artifact: "DataPoolOutput"

# ── Stage 2: Test ─────────────────────────────────────────────────────────────
- stage: Test
  displayName: "Test (Unified Matrix Shards)"
  dependsOn: Build
  condition: in(dependencies.Build.result, 'Succeeded', 'SucceededWithIssues')

  jobs:
  - job: TestShard
    displayName: "SFP Smoke"
    timeoutInMinutes: 120

    strategy:
      maxParallel: 2  # 3 agents share 1 machine — cap to 2 browsers to avoid CPU saturation
      matrix:
        ${{ if ne(parameters.suiteToRun, 'CE Only') }}:
          # BasicPolicy shards
          Shard1:
            SHARD_NUMBER: "1"
            SHARD_SUITE: "BasicPolicy"
            SHARD_SUITE_LABEL: "SFP Basic Policy"
            SHARD_FILTER_FULL: "TestCategory=Shard1"
            SHARD_FILTER_DEBUG: "TestCategory=Shard1&TestCategory=Debug"
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
          Shard2:
            SHARD_NUMBER: "2"
            SHARD_SUITE: "BasicPolicy"
            SHARD_SUITE_LABEL: "SFP Basic Policy"
            SHARD_FILTER_FULL: "TestCategory=Shard2"
            SHARD_FILTER_DEBUG: "TestCategory=Shard2&TestCategory=Debug"
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
          Shard3:
            SHARD_NUMBER: "3"
            SHARD_SUITE: "BasicPolicy"
            SHARD_SUITE_LABEL: "SFP Basic Policy"
            SHARD_FILTER_FULL: "TestCategory=Shard3"
            SHARD_FILTER_DEBUG: "TestCategory=Shard3&TestCategory=Debug"
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
          # Catch-all: only @SFP @Smoke tests not already assigned to a numbered shard
          ShardMisc:
            SHARD_NUMBER: "misc"
            SHARD_SUITE: "BasicPolicy"
            SHARD_SUITE_LABEL: "SFP Basic Policy"
            SHARD_FILTER_FULL: "TestCategory=SFP&TestCategory=Smoke&TestCategory!=Forms&TestCategory!=Shard1&TestCategory!=Shard2&TestCategory!=Shard3&TestCategory!=Shard4&TestCategory!=Shard5&TestCategory!=Shard6"
            SHARD_FILTER_DEBUG: "TestCategory=SFP&TestCategory=Smoke&TestCategory!=Forms&TestCategory!=Shard1&TestCategory!=Shard2&TestCategory!=Shard3&TestCategory!=Shard4&TestCategory!=Shard5&TestCategory!=Shard6"
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
        ${{ if ne(parameters.suiteToRun, 'BasicPolicy Only') }}:
          # CE shards
          Shard4:
            SHARD_NUMBER: "4"
            SHARD_SUITE: "CE"
            SHARD_SUITE_LABEL: "SFP Country Estate"
            SHARD_FILTER_FULL: "TestCategory=Shard4"
            SHARD_FILTER_DEBUG: "TestCategory=Shard4&TestCategory=Debug"
            DEBUG_MODE: ${{ parameters.debugModeCE }}
          Shard5:
            SHARD_NUMBER: "5"
            SHARD_SUITE: "CE"
            SHARD_SUITE_LABEL: "SFP Country Estate"
            SHARD_FILTER_FULL: "TestCategory=Shard5"
            SHARD_FILTER_DEBUG: "TestCategory=Shard5&TestCategory=Debug"
            DEBUG_MODE: ${{ parameters.debugModeCE }}
          Shard6:
            SHARD_NUMBER: "6"
            SHARD_SUITE: "CE"
            SHARD_SUITE_LABEL: "SFP Country Estate"
            SHARD_FILTER_FULL: "TestCategory=Shard6"
            SHARD_FILTER_DEBUG: "TestCategory=Shard6&TestCategory=Debug"
            DEBUG_MODE: ${{ parameters.debugModeCE }}

    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: "Install .NET SDK $(DOTNET_VERSION)"
      inputs:
        packageType: sdk
        version: $(DOTNET_VERSION)

    - task: DownloadPipelineArtifact@2
      displayName: "Download Build Output"
      inputs:
        artifact: "BuildOutput"
        targetPath: "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0"

    - task: DownloadPipelineArtifact@2
      displayName: "Download DataPool Output"
      inputs:
        artifact: "DataPoolOutput"
        targetPath: "$(Build.SourcesDirectory)/DataPool/bin/$(BUILD_CONFIGURATION)/net8.0"

    - task: Cache@2
      displayName: "Cache Playwright Chromium"
      inputs:
        key: 'playwright | "$(Agent.OS)" | $(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0/TestAutomation.deps.json'
        restoreKeys: |
          playwright | "$(Agent.OS)"
        path: "$(Agent.ToolsDirectory)/playwright-browsers"

    # ✅ Create results folder
    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/TestResults" | Out-Null
      displayName: "Create TestResults Directory"
      condition: always()

    # ✅ RUN TESTS (FIXED)
    - powershell: |
        $debugMode = $env:DEBUG_MODE -eq "True"
        $filter = if ($debugMode) { $env:SHARD_FILTER_DEBUG } else { $env:SHARD_FILTER_FULL }
        $testDll = "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0/TestAutomation.dll"

        Write-Host "===================================="
        Write-Host "Running Shard $($env:SHARD_NUMBER)"
        Write-Host "Mode:   $(if ($debugMode) { 'DEBUG' } else { 'FULL' })"
        Write-Host "Filter: $filter"
        Write-Host "DLL:    $testDll"
        Write-Host "===================================="

        if (!(Test-Path $testDll)) {
            Write-Error "Test DLL not found!"
            exit 1
        }

        & dotnet test $testDll `
            --filter "$filter" `
            --settings "$(Build.SourcesDirectory)/ci.runsettings" `
            --logger "trx;LogFileName=Shard_$($env:SHARD_NUMBER)_Results.trx" `
            --results-directory "$(Build.ArtifactStagingDirectory)/TestResults"

        # Do NOT exit on first-run failure — the retry step below will re-run failures
        $firstRunExit = $LASTEXITCODE
        Write-Host "First run exit code: $firstRunExit"
        if ($firstRunExit -ne 0 -and !(Test-Path "$(Build.ArtifactStagingDirectory)/TestResults/Shard_$($env:SHARD_NUMBER)_Results.trx")) {
          Write-Error "dotnet test failed before producing a TRX result."
          exit $firstRunExit
        }
        exit 0
      displayName: "Run Shard $(SHARD_NUMBER)"
      condition: succeeded()
      env:
        Playwright__Headless: "true"
        Playwright__BrowserType: "chromium"
        TEST_ENVIRONMENT: "qa"
        CI: "true"
        PLAYWRIGHT_BROWSERS_PATH: $(Agent.ToolsDirectory)/playwright-browsers
        DEBUG_MODE: $(DEBUG_MODE)
        SHARD_FILTER_FULL: $(SHARD_FILTER_FULL)
        SHARD_FILTER_DEBUG: $(SHARD_FILTER_DEBUG)
        SHARD_SUITE: $(SHARD_SUITE)
        SHARD_SUITE_LABEL: $(SHARD_SUITE_LABEL)
        DataPool__BaseUrl: "http://scpw-pnc-plw1:5100"

    # ✅ RETRY FAILED TESTS
    # Parses the TRX from the first run and re-runs only failed tests once.
    # This catches transient 500 errors, SSO blips, and network timeouts without
    # re-running the entire shard.
    - powershell: |
        $trxPath = "$(Build.ArtifactStagingDirectory)/TestResults/Shard_$($env:SHARD_NUMBER)_Results.trx"

        if (!(Test-Path $trxPath)) {
            Write-Host "No TRX found — skipping retry step."
            exit 0
        }

        [xml]$trx = Get-Content $trxPath
        $ns = @{ t = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010" }
        $failed = Select-Xml -Xml $trx -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns

        if (-not $failed) {
            Write-Host "No failures in first run — retry step skipped."
            exit 0
        }

        $failedFqns = @()
        foreach ($result in $failed) {
            $testId = $result.Node.testId
            $testMethod = Select-Xml -Xml $trx -XPath "//t:UnitTest[@id='$testId']/t:TestMethod" -Namespace $ns
            if ($testMethod -and $testMethod.Node.className -and $testMethod.Node.name) {
                $failedFqns += "$($testMethod.Node.className).$($testMethod.Node.name)"
            } elseif ($result.Node.testName) {
                $failedFqns += $result.Node.testName
            }
        }
        $failedFqns = $failedFqns | Select-Object -Unique

        Write-Host "Failed tests extracted:"
        $failedFqns | ForEach-Object { Write-Host "  - $_" }

        # Normalize parameterized names to method-level FQNs for a valid VSTest filter
        $failedMethodsRaw = ($failedFqns | ForEach-Object {
            if ($_ -match '^([^\(]+)') { $matches[1] } else { $_ }
        }) | ForEach-Object { $_.Trim() } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

        $failedMethods = @($failedMethodsRaw | Where-Object { $_ -match '\.' })
        $invalidMethods = @($failedMethodsRaw | Where-Object { $_ -notmatch '\.' })

        Write-Host "Retry methods extracted:"
        $failedMethodsRaw | ForEach-Object { Write-Host "  - $_" }

        if ($invalidMethods.Count -gt 0) {
            Write-Warning "Skipping non-FQN retry entries:"
            $invalidMethods | ForEach-Object { Write-Warning "  - $_" }
        }

        if ($failedMethods.Count -eq 0) {
            Write-Warning "No valid fully-qualified test names were extracted from TRX; skipping retry."
            exit 0
        }

        $nameFilter = ($failedMethods | ForEach-Object {
            $escaped = $_.Replace("'", "").Replace('"', '')
            if ($env:SHARD_NUMBER -match '^\d+$') {
                "(FullyQualifiedName~`"$escaped`"&TestCategory=Shard$($env:SHARD_NUMBER))"
            } else {
                "FullyQualifiedName~`"$escaped`""
            }
        }) -join "|"

        if ([string]::IsNullOrWhiteSpace($nameFilter)) {
            Write-Warning "Generated retry filter is empty after normalization; skipping retry."
            exit 0
        }

        Write-Host "Generated filter:"
        Write-Host $nameFilter

        $testDll = "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0/TestAutomation.dll"
        $retryCommand = "dotnet test $testDll --filter `"$nameFilter`" --settings `"$(Build.SourcesDirectory)/ci.runsettings`" --logger `"trx;LogFileName=Shard_$($env:SHARD_NUMBER)_Retry.trx`" --results-directory `"$(Build.ArtifactStagingDirectory)/TestResults`""
        Write-Host "Retry command:"
        Write-Host $retryCommand

        & dotnet test $testDll `
            --filter "$nameFilter" `
            --settings "$(Build.SourcesDirectory)/ci.runsettings" `
            --logger "trx;LogFileName=Shard_$($env:SHARD_NUMBER)_Retry.trx" `
            --results-directory "$(Build.ArtifactStagingDirectory)/TestResults"

        $retryExitCode = $LASTEXITCODE
        Write-Host "Retry exit code: $retryExitCode"
        if ($retryExitCode -ne 0) {
            Write-Error "Retry failed for shard $($env:SHARD_NUMBER). Filter: $nameFilter"
            exit $retryExitCode
        }

        exit 0
      displayName: "Retry Failed Tests — Shard $(SHARD_NUMBER)"
      condition: always()
      env:
        Playwright__Headless: "true"
        Playwright__BrowserType: "chromium"
        TEST_ENVIRONMENT: "qa"
        CI: "true"
        PLAYWRIGHT_BROWSERS_PATH: $(Agent.ToolsDirectory)/playwright-browsers
        PLAYWRIGHT_HEADLESS: "true"
        BROWSER_TYPE: "chromium"
        DataPool__BaseUrl: "http://scpw-pnc-plw1:5100"
        DataPool__AutoStart: "false"

    # ✅ ENSURE RETRY TRX EXISTS
    # When all tests pass the retry step exits early without calling dotnet test,
    # so Shard_N_Retry.trx is never written. PublishTestResults@2 would find 0 files
    # and report Total=0 to ADO. This step promotes Results.trx -> Retry.trx so the
    # publish task always has a file to ingest, regardless of first-run outcome.
    - powershell: |
        $resultsTrx = "$(Build.ArtifactStagingDirectory)/TestResults/Shard_$($env:SHARD_NUMBER)_Results.trx"
        $retryTrx   = "$(Build.ArtifactStagingDirectory)/TestResults/Shard_$($env:SHARD_NUMBER)_Retry.trx"
        if ((Test-Path $resultsTrx) -and !(Test-Path $retryTrx)) {
            Copy-Item $resultsTrx $retryTrx
            Write-Host "All tests passed on first run — promoted Results.trx → Retry.trx for publishing"
        } elseif (Test-Path $retryTrx) {
            Write-Host "Retry.trx already exists — retry ran, using retry results"
        } else {
            Write-Warning "Neither Results.trx nor Retry.trx found — test execution may have failed entirely"
        }
      displayName: "Ensure Retry TRX Exists — Shard $(SHARD_NUMBER)"
      condition: always()
      env:
        SHARD_NUMBER: $(SHARD_NUMBER)

    # ✅ DEBUG: verify trx files exist
    - powershell: |
        Write-Host "==== TEST RESULTS CONTENT ===="
        Get-ChildItem -Recurse "$(Build.ArtifactStagingDirectory)/TestResults"
      displayName: "Debug TestResults Output"
      condition: always()

    # ✅ COLLECT SCREENSHOTS & TRACES
    # TestHooks saves failure screenshots and Playwright traces to
    # bin/Release/net8.0/TestResults/<timestamp>/ on the agent.
    # Copy them into the staging directory so they land in the published artifact.
    - powershell: |
        $screenshotsStaging = "$(Build.ArtifactStagingDirectory)/TestResults/Screenshots"
        New-Item -ItemType Directory -Force -Path $screenshotsStaging | Out-Null

        $sourceBase = "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0/TestResults"
        if (Test-Path $sourceBase) {
            $files = Get-ChildItem -Path $sourceBase -Recurse -Include "*.png","*.zip","*.webm" -ErrorAction SilentlyContinue
            if ($files.Count -gt 0) {
                $files | ForEach-Object {
                    # Preserve the relative subfolder structure under Screenshots/
                    $rel = $_.FullName.Substring($sourceBase.Length).TrimStart('\','/')
                    $dest = Join-Path $screenshotsStaging $rel
                    New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
                    Copy-Item $_.FullName -Destination $dest
                }
                Write-Host "Collected $($files.Count) screenshot/trace/video file(s)."
            } else {
                Write-Host "No screenshots, traces, or videos found (all tests may have passed)."
            }
        } else {
            Write-Host "TestResults source directory not found — skipping screenshot collection."
        }
      displayName: "Collect Screenshots & Traces"
      condition: failed()

    - task: PublishPipelineArtifact@1
      displayName: "Publish Shard Artifacts"
      condition: failed()
      inputs:
        targetPath: "$(Build.ArtifactStagingDirectory)/TestResults"
        artifact: "SFP_Smoke_Shard_$(SHARD_NUMBER)"

    # ✅ FORMS REPORTS
    # Copies HTML reports to FormsReports artifact and TRX files to TestResults
    # so PublishTestResults@2 includes forms outcomes in the ADO Tests tab.
    - powershell: |
        $reportsDir = "$(Build.ArtifactStagingDirectory)/FormsReports"
        New-Item -ItemType Directory -Force -Path $reportsDir | Out-Null

        $sourceBase = "$(Build.SourcesDirectory)/TestResults"
        if (Test-Path $sourceBase) {
            $reports = Get-ChildItem -Path $sourceBase -Recurse -Filter "FormsReport_*.html"
            if ($reports.Count -gt 0) {
                $reports | ForEach-Object {
                    Copy-Item $_.FullName -Destination $reportsDir
                    Write-Host "Collected: $($_.Name)"
                }
                Write-Host "Collected $($reports.Count) forms report(s)."
            } else {
                Write-Host "No forms reports found — forms validation may not have run or all states skipped."
            }

            # Copy forms TRX to staging TestResults so PublishTestResults@2 picks them up
            $trxFiles = Get-ChildItem -Path $sourceBase -Recurse -Filter "FormsValidation_*.trx"
            if ($trxFiles.Count -gt 0) {
                $trxFiles | ForEach-Object {
                    Copy-Item $_.FullName -Destination "$(Build.ArtifactStagingDirectory)/TestResults"
                    Write-Host "Collected TRX: $($_.Name)"
                }
            }

            # Build one consolidated Markdown summary for the pipeline Summary tab.
            # Each state writes its own .md; we just concatenate them under one shard header.
            $mdFiles = Get-ChildItem -Path $sourceBase -Recurse -Filter "FormsValidationSummary_*.md" | Sort-Object Name
            if ($mdFiles.Count -gt 0) {
                $summaryPath = "$(Build.ArtifactStagingDirectory)/FormsValidationSummary_Shard$(SHARD_NUMBER).md"
                "# Forms Validation — $(SHARD_SUITE_LABEL) — Shard $(SHARD_NUMBER)" | Out-File $summaryPath -Encoding UTF8
                "" | Out-File $summaryPath -Append
                foreach ($f in $mdFiles) {
                    Get-Content $f.FullName | Out-File $summaryPath -Append
                    "" | Out-File $summaryPath -Append
                }
                Write-Host "##vso[task.uploadsummary]$summaryPath"
            } else {
                Write-Host "No per-state summary .md files found — Summary tab card skipped."
            }
        } else {
            Write-Host "TestResults directory not found — skipping forms report collection."
        }
      displayName: "Collect Forms Validation Reports"
      condition: failed()

    - powershell: |
        $files = Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/TestResults" -Filter "Shard_*_Results.trx" -File -ErrorAction SilentlyContinue
        if (-not $files) {
            Write-Error "No Results TRX files found in $(Build.ArtifactStagingDirectory)/TestResults"
            exit 1
        }

        $total = 0
        $executed = 0
        $passed = 0
        $failed = 0

        foreach ($file in $files) {
            [xml]$trx = Get-Content $file.FullName
            $nsmgr = New-Object System.Xml.XmlNamespaceManager($trx.NameTable)
            $nsmgr.AddNamespace("t", "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
            $counters = $trx.SelectSingleNode("//t:ResultSummary/t:Counters", $nsmgr)
            if ($null -eq $counters) {
                Write-Error "Counters node not found in $($file.Name)"
                exit 1
            }

            $total += [int]$counters.total
            $executed += [int]$counters.executed
            $passed += [int]$counters.passed
            $failed += [int]$counters.failed
        }

        Write-Host "TRX Summary"
        Write-Host "------------"
        Write-Host "Total: $total"
        Write-Host "Executed: $executed"
        Write-Host "Passed: $passed"
        Write-Host "Failed: $failed"

        if ($total -eq 0 -or $executed -eq 0) {
            Write-Error "TRX validation failed. Total=$total, Executed=$executed"
            exit 1
        }
      displayName: "Validate Playwright Results TRX"
      condition: always()

    - powershell: |
        $resultsTrx = "$(Build.ArtifactStagingDirectory)/TestResults/Shard_$($env:SHARD_NUMBER)_Results.trx"
        $retryTrx = "$(Build.ArtifactStagingDirectory)/TestResults/Shard_$($env:SHARD_NUMBER)_Retry.trx"
        $trxPath = if (Test-Path $retryTrx) { $retryTrx } elseif (Test-Path $resultsTrx) { $resultsTrx } else { $null }

        if (-not $trxPath) {
            Write-Warning "No shard TRX found for timing summary."
            exit 0
        }

        [xml]$trx = Get-Content $trxPath
        $nsmgr = New-Object System.Xml.XmlNamespaceManager($trx.NameTable)
        $nsmgr.AddNamespace("t", "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
        $results = $trx.SelectNodes("//t:UnitTestResult", $nsmgr)

        if ($null -eq $results -or $results.Count -eq 0) {
            Write-Warning "No UnitTestResult nodes found in $trxPath"
            exit 0
        }

        $rows = foreach ($r in $results) {
            $duration = [TimeSpan]::Zero
            $raw = $r.GetAttribute("duration")
            if (-not [string]::IsNullOrWhiteSpace($raw)) {
                try { $duration = [TimeSpan]::Parse($raw) } catch { }
            }
            if ($duration -eq [TimeSpan]::Zero) {
                $start = $r.GetAttribute("startTime")
                $end = $r.GetAttribute("endTime")
                if ($start -and $end) {
                    try { $duration = ([DateTime]$end - [DateTime]$start) } catch { }
                }
            }
            [PSCustomObject]@{
                TestName = $r.GetAttribute("testName")
                Outcome = $r.GetAttribute("outcome")
                Seconds = [math]::Round($duration.TotalSeconds, 2)
            }
        }

        $top = $rows | Sort-Object Seconds -Descending | Select-Object -First 15
        $totalSeconds = [math]::Round((($rows | Measure-Object -Property Seconds -Sum).Sum), 2)
        $avgSeconds = if ($rows.Count -gt 0) { [math]::Round($totalSeconds / $rows.Count, 2) } else { 0 }

        $summaryPath = "$(Build.ArtifactStagingDirectory)/TimingSummary_Shard$($env:SHARD_NUMBER).md"
        "# Timing Summary — $($env:SHARD_SUITE_LABEL) — Shard $($env:SHARD_NUMBER)" | Out-File $summaryPath -Encoding UTF8
        "" | Out-File $summaryPath -Append
        "- Source TRX: $(Split-Path $trxPath -Leaf)" | Out-File $summaryPath -Append
        "- Tests in TRX: $($rows.Count)" | Out-File $summaryPath -Append
        "- Total duration (sum): $totalSeconds sec" | Out-File $summaryPath -Append
        "- Average duration: $avgSeconds sec" | Out-File $summaryPath -Append
        "" | Out-File $summaryPath -Append
        "## Top 15 slowest tests" | Out-File $summaryPath -Append
        "| Duration (s) | Outcome | Test |" | Out-File $summaryPath -Append
        "|---:|:---:|---|" | Out-File $summaryPath -Append
        foreach ($item in $top) {
            "| $($item.Seconds) | $($item.Outcome) | $($item.TestName) |" | Out-File $summaryPath -Append
        }

        Write-Host "##vso[task.uploadsummary]$summaryPath"
      displayName: "Publish Per-Shard Timing Summary"
      condition: always()

    - task: PublishTestResults@2
      displayName: "Publish Playwright Test Results"
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: "$(Build.ArtifactStagingDirectory)/TestResults/Shard_*_Results.trx"
        searchFolder: "$(Build.ArtifactStagingDirectory)/TestResults"
        mergeTestResults: true
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
        failTaskOnFailureToPublishResults: true
        testRunTitle: "SFP $(SHARD_SUITE) — Shard $(SHARD_NUMBER) — $(Build.BuildNumber)"

    # Forms results are informational — failures here must not fail the shard job
    - task: PublishTestResults@2
      displayName: "Publish Forms Validation Results (Informational)"
      condition: failed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: "$(Build.ArtifactStagingDirectory)/TestResults/FormsValidation_*.trx"
        mergeTestResults: false
        failTaskOnFailedTests: false
        testRunTitle: "Forms Validation — $(SHARD_SUITE_LABEL) — Shard $(SHARD_NUMBER)"

    - task: PublishPipelineArtifact@1
      displayName: "Publish Forms Reports"
      condition: failed()
      inputs:
        targetPath: "$(Build.ArtifactStagingDirectory)/FormsReports"
        artifact: "Forms_Reports_Shard_$(SHARD_NUMBER)"

    - powershell: |
        $pathsToClean = @(
            "$(Build.SourcesDirectory)/bin",
            "$(Build.SourcesDirectory)/obj",
            "$(Build.SourcesDirectory)/TestResults",
            "$(Build.ArtifactStagingDirectory)/TestResults",
            "$(Build.ArtifactStagingDirectory)/FormsReports"
        )

        foreach ($path in $pathsToClean) {
            if (Test-Path $path) {
                try {
                    Remove-Item -Path $path -Recurse -Force -ErrorAction Stop
                    Write-Host "Removed: $path"
                } catch {
                    Write-Warning "Failed to remove ${path}: $($_.Exception.Message)"
                }
            }
        }

        $browserProcesses = @("chrome", "msedge", "playwright")
        foreach ($name in $browserProcesses) {
            Get-Process -Name $name -ErrorAction SilentlyContinue | ForEach-Object {
                try {
                    Stop-Process -Id $_.Id -Force -ErrorAction Stop
                    Write-Host "Stopped process: $($_.ProcessName) (PID: $($_.Id))"
                } catch {
                    Write-Warning "Failed to stop $($_.ProcessName) (PID: $($_.Id)): $($_.Exception.Message)"
                }
            }
        }
      displayName: "Agent Cleanup (Shard)"
      condition: always()
      continueOnError: true

# ── Stage 3: Forms Validation (Isolated) ───────────────────────────────────────
# Run forms validation outside the shard matrix so external CLAS/DuckCreek latency
# does not inflate shard durations.
- stage: FormsValidation
  displayName: "Forms Validation (Isolated)"
  dependsOn: Build
  condition: in(dependencies.Build.result, 'Succeeded', 'SucceededWithIssues')

  jobs:
  - job: FormsValidation
    displayName: "SFP Forms Validation"
    timeoutInMinutes: 120

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: "Install .NET SDK $(DOTNET_VERSION)"
      inputs:
        packageType: sdk
        version: $(DOTNET_VERSION)

    - task: DownloadPipelineArtifact@2
      displayName: "Download Build Output"
      inputs:
        artifact: "BuildOutput"
        targetPath: "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0"

    - task: Cache@2
      displayName: "Cache Playwright Chromium"
      inputs:
        key: 'playwright | "$(Agent.OS)" | $(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0/TestAutomation.deps.json'
        restoreKeys: |
          playwright | "$(Agent.OS)"
        path: "$(Agent.ToolsDirectory)/playwright-browsers"

    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/TestResults" | Out-Null
      displayName: "Create TestResults Directory"
      condition: always()

    - powershell: |
        $testDll = "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0/TestAutomation.dll"
        $filter = "TestCategory=SFP&TestCategory=Forms&TestCategory=Smoke"

        Write-Host "===================================="
        Write-Host "Running isolated Forms validation"
        Write-Host "Filter: $filter"
        Write-Host "DLL:    $testDll"
        Write-Host "===================================="

        if (!(Test-Path $testDll)) {
            Write-Error "Test DLL not found!"
            exit 1
        }

        & dotnet test $testDll `
            --filter "$filter" `
            --settings "$(Build.SourcesDirectory)/ci.runsettings" `
            --logger "trx;LogFileName=FormsValidation_Results.trx" `
            --results-directory "$(Build.ArtifactStagingDirectory)/TestResults"

        $firstRunExit = $LASTEXITCODE
        Write-Host "Forms first run exit code: $firstRunExit"
        if ($firstRunExit -eq 0) { exit 0 }

        Write-Host "Retrying Forms validation once..."
        & dotnet test $testDll `
            --filter "$filter" `
            --settings "$(Build.SourcesDirectory)/ci.runsettings" `
            --logger "trx;LogFileName=FormsValidation_Retry.trx" `
            --results-directory "$(Build.ArtifactStagingDirectory)/TestResults"

        $retryExit = $LASTEXITCODE
        Write-Host "Forms retry exit code: $retryExit"
        if ($retryExit -ne 0) { exit $retryExit }
        exit 0
      displayName: "Run Forms Validation (with retry)"
      condition: always()
      env:
        Playwright__Headless: "true"
        Playwright__BrowserType: "chromium"
        TEST_ENVIRONMENT: "qa"
        CI: "true"
        PLAYWRIGHT_BROWSERS_PATH: $(Agent.ToolsDirectory)/playwright-browsers
        PLAYWRIGHT_HEADLESS: "true"
        BROWSER_TYPE: "chromium"
        DataPool__BaseUrl: "http://scpw-pnc-plw1:5100"
        DataPool__AutoStart: "false"

    - powershell: |
        $reportsDir = "$(Build.ArtifactStagingDirectory)/FormsReports"
        New-Item -ItemType Directory -Force -Path $reportsDir | Out-Null

        $sourceBase = "$(Build.SourcesDirectory)/TestResults"
        if (Test-Path $sourceBase) {
            $reports = Get-ChildItem -Path $sourceBase -Recurse -Filter "FormsReport_*.html"
            foreach ($r in $reports) {
                Copy-Item $r.FullName -Destination $reportsDir
                Write-Host "Collected: $($r.Name)"
            }

            $mdFiles = Get-ChildItem -Path $sourceBase -Recurse -Filter "FormsValidationSummary_*.md" | Sort-Object Name
            if ($mdFiles.Count -gt 0) {
                $summaryPath = "$(Build.ArtifactStagingDirectory)/FormsValidationSummary_Isolated.md"
                "# Forms Validation — Isolated" | Out-File $summaryPath -Encoding UTF8
                "" | Out-File $summaryPath -Append
                foreach ($f in $mdFiles) {
                    Get-Content $f.FullName | Out-File $summaryPath -Append
                    "" | Out-File $summaryPath -Append
                }
                Write-Host "##vso[task.uploadsummary]$summaryPath"
            }
        }
      displayName: "Collect Forms Validation Reports"
      condition: always()

    - task: PublishTestResults@2
      displayName: "Publish Forms Validation Results"
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: "$(Build.ArtifactStagingDirectory)/TestResults/FormsValidation_*.trx"
        searchFolder: "$(Build.ArtifactStagingDirectory)/TestResults"
        mergeTestResults: true
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
        failTaskOnFailureToPublishResults: true
        testRunTitle: "Forms Validation (Isolated) — $(Build.BuildNumber)"

    - task: PublishPipelineArtifact@1
      displayName: "Publish Forms Reports"
      condition: always()
      inputs:
        targetPath: "$(Build.ArtifactStagingDirectory)/FormsReports"
        artifact: "Forms_Reports_Isolated"

    - powershell: |
        $pathsToClean = @(
            "$(Build.SourcesDirectory)/bin",
            "$(Build.SourcesDirectory)/obj",
            "$(Build.SourcesDirectory)/TestResults",
            "$(Build.ArtifactStagingDirectory)/TestResults",
            "$(Build.ArtifactStagingDirectory)/FormsReports"
        )

        foreach ($path in $pathsToClean) {
            if (Test-Path $path) {
                try {
                    Remove-Item -Path $path -Recurse -Force -ErrorAction Stop
                    Write-Host "Removed: $path"
                } catch {
                    Write-Warning "Failed to remove ${path}: $($_.Exception.Message)"
                }
            }
        }

        $browserProcesses = @("chrome", "msedge", "playwright")
        foreach ($name in $browserProcesses) {
            Get-Process -Name $name -ErrorAction SilentlyContinue | ForEach-Object {
                try {
                    Stop-Process -Id $_.Id -Force -ErrorAction Stop
                    Write-Host "Stopped process: $($_.ProcessName) (PID: $($_.Id))"
                } catch {
                    Write-Warning "Failed to stop $($_.ProcessName) (PID: $($_.Id)): $($_.Exception.Message)"
                }
            }
        }
      displayName: "Agent Cleanup (Forms Validation)"
      condition: always()
      continueOnError: true

# ── Stage 4: CE Test ───────────────────────────────────────────────────────────
# Runs after BasicPolicy (Stage 2) regardless of pass/fail.
# Reuses the same BuildOutput artifact — no second build needed.
- stage: CE_Test
  displayName: "CE Test (Deprecated - Unified in Stage 2)"
  dependsOn: Test
  condition: false

  jobs:
  - job: CETestShard
    displayName: "SFP CE"
    timeoutInMinutes: 120

    strategy:
      maxParallel: 2  # 3 agents share 1 machine — cap to 2 browsers to avoid CPU saturation
      matrix:
        Shard4:
          SHARD_NUMBER: "4"
          SHARD_FILTER_FULL: "TestCategory=Shard4"
          SHARD_FILTER_DEBUG: "TestCategory=Shard4&TestCategory=Debug"
        Shard5:
          SHARD_NUMBER: "5"
          SHARD_FILTER_FULL: "TestCategory=Shard5"
          SHARD_FILTER_DEBUG: "TestCategory=Shard5&TestCategory=Debug"
        Shard6:
          SHARD_NUMBER: "6"
          SHARD_FILTER_FULL: "TestCategory=Shard6"
          SHARD_FILTER_DEBUG: "TestCategory=Shard6&TestCategory=Debug"

    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: "Install .NET SDK $(DOTNET_VERSION)"
      inputs:
        packageType: sdk
        version: $(DOTNET_VERSION)

    - task: DownloadPipelineArtifact@2
      displayName: "Download Build Output"
      inputs:
        artifact: "BuildOutput"
        targetPath: "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0"

    - task: DownloadPipelineArtifact@2
      displayName: "Download DataPool Output"
      inputs:
        artifact: "DataPoolOutput"
        targetPath: "$(Build.SourcesDirectory)/DataPool/bin/$(BUILD_CONFIGURATION)/net8.0"

    - task: Cache@2
      displayName: "Cache Playwright Chromium"
      inputs:
        key: 'playwright | "$(Agent.OS)" | $(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0/TestAutomation.deps.json'
        restoreKeys: |
          playwright | "$(Agent.OS)"
        path: "$(Agent.ToolsDirectory)/playwright-browsers"

    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/TestResults" | Out-Null
      displayName: "Create TestResults Directory"
      condition: always()

    - powershell: |
        $debugMode = $env:DEBUG_MODE -eq "True"
        $filter = if ($debugMode) { $env:SHARD_FILTER_DEBUG } else { $env:SHARD_FILTER_FULL }
        $testDll = "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0/TestAutomation.dll"

        Write-Host "===================================="
        Write-Host "Running CE Shard $($env:SHARD_NUMBER)"
        Write-Host "Mode:   $(if ($debugMode) { 'DEBUG' } else { 'FULL' })"
        Write-Host "Filter: $filter"
        Write-Host "DLL:    $testDll"
        Write-Host "===================================="

        if (!(Test-Path $testDll)) {
            Write-Error "Test DLL not found!"
            exit 1
        }

        & dotnet test $testDll `
            --filter "$filter" `
            --settings "$(Build.SourcesDirectory)/ci.runsettings" `
            --logger "trx;LogFileName=Shard_$($env:SHARD_NUMBER)_Results.trx" `
            --results-directory "$(Build.ArtifactStagingDirectory)/TestResults"

        $firstRunExit = $LASTEXITCODE
        Write-Host "First run exit code: $firstRunExit"
        if ($firstRunExit -ne 0 -and !(Test-Path "$(Build.ArtifactStagingDirectory)/TestResults/Shard_$($env:SHARD_NUMBER)_Results.trx")) {
          Write-Error "dotnet test failed before producing a TRX result."
          exit $firstRunExit
        }
        exit 0
      displayName: "Run CE Shard $(SHARD_NUMBER)"
      condition: succeeded()
      env:
        Playwright__Headless: "true"
        Playwright__BrowserType: "chromium"
        TEST_ENVIRONMENT: "qa"
        CI: "true"
        PLAYWRIGHT_BROWSERS_PATH: $(Agent.ToolsDirectory)/playwright-browsers
        DEBUG_MODE: ${{ parameters.debugModeCE }}
        SHARD_FILTER_FULL: $(SHARD_FILTER_FULL)
        SHARD_FILTER_DEBUG: $(SHARD_FILTER_DEBUG)
        DataPool__BaseUrl: "http://scpw-pnc-plw1:5100"

    - powershell: |
        $trxPath = "$(Build.ArtifactStagingDirectory)/TestResults/Shard_$($env:SHARD_NUMBER)_Results.trx"

        if (!(Test-Path $trxPath)) {
            Write-Host "No TRX found — skipping retry step."
            exit 0
        }

        [xml]$trx = Get-Content $trxPath
        $ns = @{ t = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010" }
        $failed = Select-Xml -Xml $trx -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns

        if (-not $failed) {
            Write-Host "No failures in first run — retry step skipped."
            exit 0
        }

        $failedFqns = @()
        foreach ($result in $failed) {
            $testId = $result.Node.testId
            $testMethod = Select-Xml -Xml $trx -XPath "//t:UnitTest[@id='$testId']/t:TestMethod" -Namespace $ns
            if ($testMethod -and $testMethod.Node.className -and $testMethod.Node.name) {
                $failedFqns += "$($testMethod.Node.className).$($testMethod.Node.name)"
            } elseif ($result.Node.testName) {
                $failedFqns += $result.Node.testName
            }
        }
        $failedFqns = $failedFqns | Select-Object -Unique

        Write-Host "Failed tests extracted:"
        $failedFqns | ForEach-Object { Write-Host "  - $_" }

        # Normalize parameterized names to method-level FQNs for a valid VSTest filter
        $failedMethods = ($failedFqns | ForEach-Object {
            if ($_ -match '^([^\(]+)') { $matches[1] } else { $_ }
        }) | Select-Object -Unique

        Write-Host "Retry methods extracted:"
        $failedMethods | ForEach-Object { Write-Host "  - $_" }

        $nameFilter = ($failedMethods | ForEach-Object {
            $escaped = $_.Replace("'", "").Replace('"', '')
            if ($env:SHARD_NUMBER -match '^\d+$') {
                "(FullyQualifiedName~`"$escaped`"&TestCategory=Shard$($env:SHARD_NUMBER))"
            } else {
                "FullyQualifiedName~`"$escaped`""
            }
        }) -join "|"

        Write-Host "Generated filter:"
        Write-Host $nameFilter

        $testDll = "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0/TestAutomation.dll"
        $retryCommand = "dotnet test $testDll --filter `"$nameFilter`" --settings `"$(Build.SourcesDirectory)/ci.runsettings`" --logger `"trx;LogFileName=Shard_$($env:SHARD_NUMBER)_Retry.trx`" --results-directory `"$(Build.ArtifactStagingDirectory)/TestResults`""
        Write-Host "Retry command:"
        Write-Host $retryCommand

        & dotnet test $testDll `
            --filter "$nameFilter" `
            --settings "$(Build.SourcesDirectory)/ci.runsettings" `
            --logger "trx;LogFileName=Shard_$($env:SHARD_NUMBER)_Retry.trx" `
            --results-directory "$(Build.ArtifactStagingDirectory)/TestResults"

        $retryExitCode = $LASTEXITCODE
        Write-Host "Retry exit code: $retryExitCode"
        if ($retryExitCode -ne 0) {
            Write-Error "Retry failed for shard $($env:SHARD_NUMBER). Filter: $nameFilter"
            exit $retryExitCode
        }

        exit 0
      displayName: "Retry Failed Tests — Shard $(SHARD_NUMBER)"
      condition: always()
      env:
        Playwright__Headless: "true"
        Playwright__BrowserType: "chromium"
        TEST_ENVIRONMENT: "qa"
        CI: "true"
        PLAYWRIGHT_BROWSERS_PATH: $(Agent.ToolsDirectory)/playwright-browsers
        PLAYWRIGHT_HEADLESS: "true"
        BROWSER_TYPE: "chromium"
        DataPool__BaseUrl: "http://scpw-pnc-plw1:5100"
        DataPool__AutoStart: "false"

    # ✅ ENSURE RETRY TRX EXISTS
    - powershell: |
        $resultsTrx = "$(Build.ArtifactStagingDirectory)/TestResults/Shard_$($env:SHARD_NUMBER)_Results.trx"
        $retryTrx   = "$(Build.ArtifactStagingDirectory)/TestResults/Shard_$($env:SHARD_NUMBER)_Retry.trx"
        if ((Test-Path $resultsTrx) -and !(Test-Path $retryTrx)) {
            Copy-Item $resultsTrx $retryTrx
            Write-Host "All tests passed on first run — promoted Results.trx → Retry.trx for publishing"
        } elseif (Test-Path $retryTrx) {
            Write-Host "Retry.trx already exists — retry ran, using retry results"
        } else {
            Write-Warning "Neither Results.trx nor Retry.trx found — test execution may have failed entirely"
        }
      displayName: "Ensure Retry TRX Exists — Shard $(SHARD_NUMBER)"
      condition: always()
      env:
        SHARD_NUMBER: $(SHARD_NUMBER)

    - powershell: |
        Write-Host "==== CE TEST RESULTS CONTENT ===="
        Get-ChildItem -Recurse "$(Build.ArtifactStagingDirectory)/TestResults"
      displayName: "Debug TestResults Output"
      condition: always()

    - powershell: |
        $screenshotsStaging = "$(Build.ArtifactStagingDirectory)/TestResults/Screenshots"
        New-Item -ItemType Directory -Force -Path $screenshotsStaging | Out-Null

        $sourceBase = "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0/TestResults"
        if (Test-Path $sourceBase) {
            $files = Get-ChildItem -Path $sourceBase -Recurse -Include "*.png","*.zip" -ErrorAction SilentlyContinue
            if ($files.Count -gt 0) {
                $files | ForEach-Object {
                    $rel = $_.FullName.Substring($sourceBase.Length).TrimStart('\','/')
                    $dest = Join-Path $screenshotsStaging $rel
                    New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
                    Copy-Item $_.FullName -Destination $dest
                }
                Write-Host "Collected $($files.Count) screenshot/trace file(s)."
            } else {
                Write-Host "No screenshots or traces found (all tests may have passed)."
            }
        } else {
            Write-Host "TestResults source directory not found — skipping screenshot collection."
        }
      displayName: "Collect Screenshots & Traces"
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: "Publish Shard Artifacts"
      condition: always()
      inputs:
        targetPath: "$(Build.ArtifactStagingDirectory)/TestResults"
        artifact: "SFP_CE_Shard_$(SHARD_NUMBER)"

    - powershell: |
        $reportsDir = "$(Build.ArtifactStagingDirectory)/FormsReports"
        New-Item -ItemType Directory -Force -Path $reportsDir | Out-Null

        $sourceBase = "$(Build.SourcesDirectory)/TestResults"
        if (Test-Path $sourceBase) {
            $reports = Get-ChildItem -Path $sourceBase -Recurse -Filter "FormsReport_*.html"
            if ($reports.Count -gt 0) {
                $reports | ForEach-Object {
                    Copy-Item $_.FullName -Destination $reportsDir
                    Write-Host "Collected: $($_.Name)"
                }
                Write-Host "Collected $($reports.Count) forms report(s)."
            } else {
                Write-Host "No forms reports found — forms validation may not have run or all states skipped."
            }

            # Copy forms TRX to staging TestResults so PublishTestResults@2 picks them up
            $trxFiles = Get-ChildItem -Path $sourceBase -Recurse -Filter "FormsValidation_*.trx"
            if ($trxFiles.Count -gt 0) {
                $trxFiles | ForEach-Object {
                    Copy-Item $_.FullName -Destination "$(Build.ArtifactStagingDirectory)/TestResults"
                    Write-Host "Collected TRX: $($_.Name)"
                }
            }

            # Build one consolidated Markdown summary for the pipeline Summary tab.
            $mdFiles = Get-ChildItem -Path $sourceBase -Recurse -Filter "FormsValidationSummary_*.md" | Sort-Object Name
            if ($mdFiles.Count -gt 0) {
                $summaryPath = "$(Build.ArtifactStagingDirectory)/FormsValidationSummary_CE_Shard$(SHARD_NUMBER).md"
                "# Forms Validation — SFP Country Estate — Shard $(SHARD_NUMBER)" | Out-File $summaryPath -Encoding UTF8
                "" | Out-File $summaryPath -Append
                foreach ($f in $mdFiles) {
                    Get-Content $f.FullName | Out-File $summaryPath -Append
                    "" | Out-File $summaryPath -Append
                }
                Write-Host "##vso[task.uploadsummary]$summaryPath"
            } else {
                Write-Host "No per-state summary .md files found — Summary tab card skipped."
            }
        } else {
            Write-Host "TestResults directory not found — skipping forms report collection."
        }
      displayName: "Collect Forms Validation Reports"
      condition: always()

    - powershell: |
        $files = Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)/TestResults" -Filter "Shard_*_Results.trx" -File -ErrorAction SilentlyContinue
        if (-not $files) {
            Write-Error "No Results TRX files found in $(Build.ArtifactStagingDirectory)/TestResults"
            exit 1
        }

        $total = 0
        $executed = 0
        $passed = 0
        $failed = 0

        foreach ($file in $files) {
            [xml]$trx = Get-Content $file.FullName
            $nsmgr = New-Object System.Xml.XmlNamespaceManager($trx.NameTable)
            $nsmgr.AddNamespace("t", "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
            $counters = $trx.SelectSingleNode("//t:ResultSummary/t:Counters", $nsmgr)
            if ($null -eq $counters) {
                Write-Error "Counters node not found in $($file.Name)"
                exit 1
            }

            $total += [int]$counters.total
            $executed += [int]$counters.executed
            $passed += [int]$counters.passed
            $failed += [int]$counters.failed
        }

        Write-Host "TRX Summary"
        Write-Host "------------"
        Write-Host "Total: $total"
        Write-Host "Executed: $executed"
        Write-Host "Passed: $passed"
        Write-Host "Failed: $failed"

        if ($total -eq 0 -or $executed -eq 0) {
            Write-Error "TRX validation failed. Total=$total, Executed=$executed"
            exit 1
        }
      displayName: "Validate Playwright Results TRX"
      condition: always()

    - task: PublishTestResults@2
      displayName: "Publish Playwright Test Results"
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: "$(Build.ArtifactStagingDirectory)/TestResults/Shard_*_Results.trx"
        searchFolder: "$(Build.ArtifactStagingDirectory)/TestResults"
        mergeTestResults: true
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
        failTaskOnFailureToPublishResults: true
        testRunTitle: "SFP CE — Shard $(SHARD_NUMBER) — $(Build.BuildNumber)"

    # Forms results are informational — failures here must not fail the shard job
    - task: PublishTestResults@2
      displayName: "Publish Forms Validation Results (Informational)"
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: "$(Build.ArtifactStagingDirectory)/TestResults/FormsValidation_*.trx"
        mergeTestResults: false
        failTaskOnFailedTests: false
        testRunTitle: "Forms Validation — SFP CE — Shard $(SHARD_NUMBER)"

    - task: PublishPipelineArtifact@1
      displayName: "Publish Forms Reports"
      condition: always()
      inputs:
        targetPath: "$(Build.ArtifactStagingDirectory)/FormsReports"
        artifact: "Forms_Reports_CE_Shard_$(SHARD_NUMBER)"

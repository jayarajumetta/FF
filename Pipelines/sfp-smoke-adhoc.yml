# Pipeline: SFP Smoke — .NET Playwright (Reqnroll + NUnit)
# Trigger: Manual only

trigger: none
pr: none

pool:
  name: "Default"

variables:
  DOTNET_VERSION: "8.x"
  BUILD_CONFIGURATION: "Release"

# ── Stage 1: Build ─────────────────────────────────────────────────────────────
stages:
- stage: Build
  displayName: "Build"

  jobs:
  - job: Build
    displayName: "Restore, Build & Publish Artifact"
    timeoutInMinutes: 20

    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: "Install .NET SDK $(DOTNET_VERSION)"
      inputs:
        packageType: sdk
        version: $(DOTNET_VERSION)

    - script: dotnet restore TestAutomation.csproj
      displayName: "Restore NuGet packages"
      workingDirectory: $(Build.SourcesDirectory)

    - script: dotnet build TestAutomation.csproj --configuration $(BUILD_CONFIGURATION) --no-restore
      displayName: "Build project"
      workingDirectory: $(Build.SourcesDirectory)

    - powershell: |
        $playwright = Get-ChildItem -Recurse -Filter playwright.ps1 | Select-Object -First 1
        if ($playwright) {
            Write-Host "Installing Playwright via $($playwright.FullName)"
            & powershell -File $playwright.FullName install chromium --with-deps
        } else {
            Write-Error "playwright.ps1 not found"
            exit 1
        }
      displayName: "Install Playwright Chromium"

    - task: PublishPipelineArtifact@1
      displayName: "Publish Build Output"
      inputs:
        targetPath: "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0"
        artifact: "BuildOutput"

# ── Stage 2: Test ─────────────────────────────────────────────────────────────
- stage: Test
  displayName: "Test (3 Parallel Shards)"
  dependsOn: Build

  jobs:
  - job: TestShard
    displayName: "SFP Smoke"
    timeoutInMinutes: 60

    strategy:
      matrix:
        # Shard 1 — 11 states: AL AR AZ CO ID IL IN IA KS KY LA (all single-word, no escaping needed)
        Shard1:
          SHARD_NUMBER: "1"
          SHARD_FILTER: "FullyQualifiedName~SFP_BasicPolicy&(FullyQualifiedName~Alabama|FullyQualifiedName~Arkansas|FullyQualifiedName~Arizona|FullyQualifiedName~Colorado|FullyQualifiedName~Idaho|FullyQualifiedName~Illinois|FullyQualifiedName~Indiana|FullyQualifiedName~Iowa|FullyQualifiedName~Kansas|FullyQualifiedName~Kentucky|FullyQualifiedName~Louisiana)"
        # Shard 2 — 10 states: MS MO MN MT NE NV NH NM ND OK
        # Multi-word states use \" so NUnit parses the full phrase (e.g. "North Dakota")
        # rather than just "North" which would collide with Ohio's "Northeast Ave" address.
        Shard2:
          SHARD_NUMBER: "2"
          SHARD_FILTER: "FullyQualifiedName~SFP_BasicPolicy&(FullyQualifiedName~Mississippi|FullyQualifiedName~Missouri|FullyQualifiedName~Minnesota|FullyQualifiedName~Montana|FullyQualifiedName~Nebraska|FullyQualifiedName~Nevada|FullyQualifiedName~\"New Hampshire\"|FullyQualifiedName~\"New Mexico\"|FullyQualifiedName~\"North Dakota\"|FullyQualifiedName~Oklahoma)"
        # Shard 3 — 10 states: OH OR SC SD TN TX UT WA WI WY
        # South Carolina/South Dakota use full quoted names to avoid partial "South" or "Dakota" matches.
        # Washington (WA) is matched via its unique Jefferson county to avoid collisions with
        # Mississippi ("4105 Washington Ave") and Tennessee (Washington county).
        Shard3:
          SHARD_NUMBER: "3"
          SHARD_FILTER: "FullyQualifiedName~SFP_BasicPolicy&(FullyQualifiedName~Ohio|FullyQualifiedName~Oregon|FullyQualifiedName~\"South Carolina\"|FullyQualifiedName~\"South Dakota\"|FullyQualifiedName~Tennessee|FullyQualifiedName~Texas|FullyQualifiedName~Utah|FullyQualifiedName~Jefferson|FullyQualifiedName~Wisconsin|FullyQualifiedName~Wyoming)"

    steps:

    - checkout: self

    - task: DownloadPipelineArtifact@2
      displayName: "Download Build Output"
      inputs:
        artifact: "BuildOutput"
        targetPath: "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0"

    - powershell: |
        $playwright = Get-ChildItem `
            -Path "$(Build.SourcesDirectory)/bin/$(BUILD_CONFIGURATION)/net8.0" `
            -Filter playwright.ps1 | Select-Object -First 1

        if ($playwright) {
            Write-Host "Installing Playwright via $($playwright.FullName)"
            & powershell -File $playwright.FullName install chromium --with-deps
        } else {
            Write-Warning "playwright.ps1 not found — assuming pre-installed"
        }
      displayName: "Ensure Playwright Chromium"

    # ✅ Always create results directory
    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/TestResults" | Out-Null
      displayName: "Create TestResults Directory"
      condition: always()

    # ✅ Run shard
    - powershell: |
        if (-not $env:SHARD_FILTER) {
            Write-Error "SHARD_FILTER is empty!"
            exit 1
        }

        Write-Host "===================================="
        Write-Host "Running Shard $($env:SHARD_NUMBER)"
        Write-Host "Using filter:"
        Write-Host "$env:SHARD_FILTER"
        Write-Host "===================================="

        & dotnet test TestAutomation.csproj `
            --configuration "$(BUILD_CONFIGURATION)" `
            --no-build `
            --filter "$env:SHARD_FILTER" `
            --logger "trx;LogFileName=Shard_$($env:SHARD_NUMBER)_Results.trx" `
            --results-directory "$(Build.ArtifactStagingDirectory)/TestResults"

        exit $LASTEXITCODE
      displayName: "Run Shard $(SHARD_NUMBER)"
      workingDirectory: $(Build.SourcesDirectory)
      env:
        Playwright__Headless: "true"
        Playwright__BrowserType: "chromium"
        TEST_ENVIRONMENT: "qa"

    - task: PublishTestResults@2
      displayName: "Publish Test Results"
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: "$(Build.ArtifactStagingDirectory)/TestResults/*.trx"
        mergeTestResults: true
        failTaskOnFailedTests: true
        testRunTitle: "SFP Smoke — Shard $(SHARD_NUMBER) — $(Build.BuildNumber)"

    - task: PublishPipelineArtifact@1
      displayName: "Publish Shard Artifacts"
      condition: always()
      inputs:
        targetPath: "$(Build.ArtifactStagingDirectory)/TestResults"
        artifact: "SFP_Smoke_Shard_$(SHARD_NUMBER)"

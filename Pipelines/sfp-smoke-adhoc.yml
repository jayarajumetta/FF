# Canonical SFP CI, PR, manual, and Development schedule entry point.
trigger:
  branches:
    include:
      - main
      - Development
      - "pa3402-anico-combined-framework-*"

pr:
  branches:
    include:
      - main
      - Development
      - "pa3402-anico-combined-framework-*"

schedules:
  - cron: "0 6 * * *"
    displayName: "Midnight Central - Full Suite"
    branches:
      include:
        - Development
    always: true
  - cron: "0 17 * * *"
    displayName: "11:00 AM Central - Full Suite"
    branches:
      include:
        - Development
    always: true

parameters:
  - name: debugModeBasic
    displayName: "Debug Mode: BasicPolicy"
    type: boolean
    default: false
  - name: debugModeCE
    displayName: "Debug Mode: CE"
    type: boolean
    default: false
  - name: suiteToRun
    displayName: "Suite to Run"
    type: string
    default: All
    values:
      - All
      - BasicPolicy Only
      - CE Only
  - name: setupDataPoolService
    displayName: "[One-time] Install DataPool as Windows Service"
    type: boolean
    default: false

pool:
  name: Playwright

stages:
  - template: templates/build-package-stage.yml

  - template: templates/setup-datapool-stage.yml
    parameters:
      enabled: ${{ parameters.setupDataPoolService }}

  - template: templates/test-shards-stage.yml
    parameters:
      dependsOn:
        - BuildPackage
        - SetupDataPool
      condition: and(succeeded('BuildPackage'), in(dependencies.SetupDataPool.result, 'Succeeded', 'Skipped'))
      maxParallel: 2
      matrix:
        ${{ if ne(parameters.suiteToRun, 'CE Only') }}:
          Basic1:
            SHARD_ID: Basic1
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
          Basic2:
            SHARD_ID: Basic2
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
          Basic3:
            SHARD_ID: Basic3
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
          BasicMisc:
            SHARD_ID: BasicMisc
            DEBUG_MODE: ${{ parameters.debugModeBasic }}
        ${{ if ne(parameters.suiteToRun, 'BasicPolicy Only') }}:
          CE4:
            SHARD_ID: CE4
            DEBUG_MODE: ${{ parameters.debugModeCE }}
          CE5:
            SHARD_ID: CE5
            DEBUG_MODE: ${{ parameters.debugModeCE }}
          CE6:
            SHARD_ID: CE6
            DEBUG_MODE: ${{ parameters.debugModeCE }}

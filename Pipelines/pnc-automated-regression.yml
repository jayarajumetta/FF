# Pipeline: PnC Automated Regression
# Build once, validate the environment, then let VSTest distribute tests across agents.

trigger: none
pr: none

schedules:
- cron: "0 6 * * *"
  displayName: "Nightly full suite - 06:00 UTC (00:00 CST / 01:00 CDT)"
  branches:
    include:
    - Development
  always: true

parameters:
- name: pipelineMode
  displayName: "Pipeline mode"
  type: string
  default: Regression
  values:
  - Regression
  - FormsDelta

- name: environment
  displayName: "Environment"
  type: string
  default: QA
  values:
  - QA
  - IT

- name: suite
  displayName: "Suite"
  type: string
  default: All
  values:
  - All
  - SingleExample
  - BasicPolicy
  - CountryEstate
  - Smoke

- name: agentCount
  displayName: "Independent test agents"
  type: number
  default: 1
  values:
  - 1
  - 2
  - 3

- name: runSmokeGate
  displayName: "Run ExpertQuote smoke gate before the suite"
  type: boolean
  default: true

- name: sourceFamily
  displayName: "Forms delta changed source family"
  type: string
  default: SFP
  values:
  - SFP
  - Common

- name: eventId
  displayName: "Forms delta event ID"
  type: string
  default: ""

- name: correlationId
  displayName: "Forms delta correlation ID"
  type: string
  default: ""

- name: previousSourceIdentity
  displayName: "Previous changed-source identity"
  type: string
  default: ""

- name: previousSourceReference
  displayName: "Previous immutable SharePoint item/version reference"
  type: string
  default: ""

- name: previousSourceSha256
  displayName: "Previous changed-source SHA-256"
  type: string
  default: ""

- name: currentSourceIdentity
  displayName: "Current changed-source identity"
  type: string
  default: ""

- name: currentSourceReference
  displayName: "Current immutable SharePoint item/version reference"
  type: string
  default: ""

- name: currentSourceSha256
  displayName: "Current changed-source SHA-256"
  type: string
  default: ""

- name: counterpartSourceIdentity
  displayName: "Current counterpart identity"
  type: string
  default: ""

- name: counterpartSourceReference
  displayName: "Current counterpart SharePoint item/version reference"
  type: string
  default: ""

- name: counterpartSourceSha256
  displayName: "Current counterpart SHA-256"
  type: string
  default: ""

- name: approvedBaselineSha256
  displayName: "Approved Forms baseline SHA-256"
  type: string
  default: ""

- name: branch
  displayName: "Expected Forms delta source branch"
  type: string
  default: Development

- name: allowReviewedChanges
  displayName: "Allow reviewed Forms changes"
  type: boolean
  default: false

- name: writePackage
  displayName: "Write Forms delta review package"
  type: boolean
  default: false

- name: overwriteExisting
  displayName: "Overwrite existing Forms delta output"
  type: boolean
  default: false

variables:
- group: "PnC_DC_TestAutomation"
- name: DOTNET_VERSION
  value: "8.0.x"
- name: BUILD_CONFIGURATION
  value: "Release"
- name: NUGET_PACKAGES
  value: '$(Pipeline.Workspace)\.nuget\packages'
- name: PACKAGE_ROOT
  value: '$(Pipeline.Workspace)\testpackage'
- name: DATA_POOL_URL
  value: "http://scpw-pnc-plw1:5100"
- name: PLAYWRIGHT_VERSION
  value: "1.57.0"
- name: DELTA_RESULTS_ROOT
  value: '$(Build.ArtifactStagingDirectory)\FormsDelta'

- ${{ if eq(parameters.suite, 'All') }}:
  - name: TEST_FILTER
    value: "TestCategory=SFP&TestCategory!=DevOnly"
- ${{ if eq(parameters.suite, 'SingleExample') }}:
  - name: TEST_FILTER
    value: "TestCategory=PipelineSmoke&TestCategory!=DevOnly"
- ${{ if eq(parameters.suite, 'BasicPolicy') }}:
  - name: TEST_FILTER
    value: "TestCategory=SFP&TestCategory!=CE&TestCategory!=DevOnly"
- ${{ if eq(parameters.suite, 'CountryEstate') }}:
  - name: TEST_FILTER
    value: "TestCategory=CE&TestCategory!=DevOnly"
- ${{ if eq(parameters.suite, 'Smoke') }}:
  - name: TEST_FILTER
    value: "TestCategory=Smoke&TestCategory!=DevOnly"

stages:
- stage: Build
  displayName: "Build immutable test package"
  condition: and(succeeded(), ${{ eq(parameters.pipelineMode, 'Regression') }})
  pool:
    vmImage: "windows-latest"
  jobs:
  - job: Package
    displayName: "Restore, build, and package"
    timeoutInMinutes: 20
    steps:
    - checkout: self
      clean: true

    - task: UseDotNet@2
      displayName: "Install .NET SDK $(DOTNET_VERSION)"
      inputs:
        packageType: sdk
        version: "$(DOTNET_VERSION)"

    - task: Cache@2
      displayName: "Cache NuGet packages"
      inputs:
        key: 'nuget | "$(Agent.OS)" | TestAutomation.csproj'
        restoreKeys: |
          nuget | "$(Agent.OS)"
        path: "$(NUGET_PACKAGES)"

    - powershell: |
        dotnet restore TestAutomation.csproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        dotnet build TestAutomation.csproj `
          --configuration "$(BUILD_CONFIGURATION)" `
          --no-restore
        exit $LASTEXITCODE
      displayName: "Restore and build"
      env:
        NUGET_PACKAGES: "$(NUGET_PACKAGES)"

    - powershell: |
        $ErrorActionPreference = "Stop"
        $packageRoot = "$(Build.ArtifactStagingDirectory)\testpackage"
        $testsRoot = Join-Path $packageRoot "tests"
        $adapterRoot = Join-Path $packageRoot "adapters"
        $scriptsRoot = Join-Path $packageRoot "scripts"

        New-Item -ItemType Directory -Force -Path $testsRoot, $adapterRoot, $scriptsRoot | Out-Null

        Copy-Item `
          "$(Build.SourcesDirectory)\bin\$(BUILD_CONFIGURATION)\net8.0\*" `
          $testsRoot `
          -Recurse `
          -Force

        Copy-Item "$(Build.SourcesDirectory)\ci.runsettings" $packageRoot -Force
        Copy-Item "$(Build.SourcesDirectory)\Scripts\Initialize-PipelineTestRuntime.ps1" $scriptsRoot -Force

        $settingsPath = Join-Path $testsRoot "appsettings.json"
        $settings = Get-Content -LiteralPath $settingsPath -Raw | ConvertFrom-Json
        foreach ($property in @("Username", "Password")) {
          $settings.Credentials.$property = ""
          $settings.QAExpressCreds.$property = ""
        }
        $settings.OAuthConfig.ClientSecret = ""
        foreach ($property in @("Username", "Password", "CLASUsername", "CLASPassword")) {
          $settings.DuckCreekForms.$property = ""
        }
        $settings |
          ConvertTo-Json -Depth 100 |
          Set-Content -LiteralPath $settingsPath -Encoding UTF8

        $adapter = Get-ChildItem `
          -Path "$(NUGET_PACKAGES)\nunit3testadapter" `
          -Filter "NUnit3.TestAdapter.dll" `
          -Recurse `
          -File |
          Where-Object { $_.FullName -match "\\build\\net8\.0\\" } |
          Sort-Object FullName -Descending |
          Select-Object -First 1

        if (-not $adapter) {
          throw "NUnit3 test adapter was not restored."
        }

        Copy-Item (Join-Path $adapter.Directory.FullName "*") $adapterRoot -Recurse -Force

        [ordered]@{
          buildId = "$(Build.BuildId)"
          buildNumber = "$(Build.BuildNumber)"
          sourceVersion = "$(Build.SourceVersion)"
          sourceBranch = "$(Build.SourceBranch)"
          createdUtc = [DateTime]::UtcNow.ToString("O")
        } |
          ConvertTo-Json |
          Set-Content (Join-Path $packageRoot "package-info.json") -Encoding UTF8
      displayName: "Create immutable test package"

    - task: PublishPipelineArtifact@1
      displayName: "Publish test package"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\testpackage'
        artifact: "testpackage"

- stage: Preflight
  displayName: "Validate environment and smoke login"
  dependsOn: Build
  condition: and(succeeded(), ${{ eq(parameters.pipelineMode, 'Regression') }})
  pool:
    name: "Playwright"
  jobs:
  - job: Validate
    displayName: "Preflight ${{ parameters.environment }}"
    timeoutInMinutes: 45
    variables:
      TEST_RESULTS_ROOT: '$(Agent.TempDirectory)\PnC-Preflight-$(Build.BuildId)-$(System.JobAttempt)'
    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: "Download immutable test package"
      inputs:
        artifact: "testpackage"
        targetPath: "$(PACKAGE_ROOT)"

    - task: UseDotNet@2
      displayName: "Install .NET SDK $(DOTNET_VERSION)"
      inputs:
        packageType: sdk
        version: "$(DOTNET_VERSION)"

    - task: VisualStudioTestPlatformInstaller@1
      displayName: "Install VSTest platform"
      inputs:
        packageFeedSelector: nugetOrg
        versionSelector: latestStable

    - task: Cache@2
      displayName: "Cache Playwright Chromium"
      inputs:
        key: 'playwright | "$(Agent.OS)" | "$(PLAYWRIGHT_VERSION)"'
        restoreKeys: |
          playwright | "$(Agent.OS)"
        path: '$(Agent.ToolsDirectory)\playwright-browsers'

    - task: PowerShell@2
      displayName: "Initialize agent and validate dependencies"
      inputs:
        targetType: filePath
        filePath: '$(PACKAGE_ROOT)\scripts\Initialize-PipelineTestRuntime.ps1'
        arguments: >
          -ArtifactRoot "$(PACKAGE_ROOT)"
          -ResultsRoot "$(TEST_RESULTS_ROOT)"
          -Environment "${{ parameters.environment }}"
          -DataPoolUrl "$(DATA_POOL_URL)"
          -ValidateEndpoints
      env:
        Credentials__Username: "$(CL_EQ_USERNAME)"
        Credentials__Password: "$(CL_EQ_PASSWORD)"
        DuckCreekForms__Username: "$(CL_DC_USERNAME)"
        DUCKCREEK_PASSWORD: "$(CL_DC_PASSWORD)"
        DuckCreekForms__CLASUsername: "$(CL_DC_USERNAME)"
        DuckCreekForms__CLASPassword: "$(CL_DC_PASSWORD)"

    - task: VSTest@3
      displayName: "Run ExpertQuote smoke gate"
      condition: and(succeeded(), ${{ and(eq(parameters.runSmokeGate, true), ne(parameters.suite, 'SingleExample')) }})
      inputs:
        testSelector: testAssemblies
        testAssemblyVer2: |
          **\TestAutomation.dll
          !**\*TestAdapter.dll
        searchFolder: '$(PACKAGE_ROOT)\tests'
        pathtoCustomTestAdapters: '$(PACKAGE_ROOT)\adapters'
        testFiltercriteria: "TestCategory=Smoke&TestCategory=ExpertQuote&TestCategory!=DevOnly"
        runSettingsFile: '$(PACKAGE_ROOT)\ci.runsettings'
        resultsFolder: '$(TEST_RESULTS_ROOT)\VSTest'
        vsTestVersion: toolsInstaller
        uiTests: true
        runInParallel: false
        dontDistribute: true
        diagnosticsEnabled: true
        collectDumpOn: onAbortOnly
        rerunFailedTests: false
        publishRunAttachments: true
        failOnMinTestsNotRun: true
        minimumExpectedTests: "1"
        testRunTitle: "PnC preflight ${{ parameters.environment }} $(Build.BuildNumber)"
      env:
        CI: "true"
        TEST_ENVIRONMENT: "${{ parameters.environment }}"
        TEST_RESULTS_ROOT: "$(TEST_RESULTS_ROOT)"
        PLAYWRIGHT_BROWSERS_PATH: "$(PLAYWRIGHT_BROWSERS_PATH)"
        Playwright__Headless: "true"
        Playwright__BrowserType: "chromium"
        Playwright__TraceEnabled: "true"
        DataPool__BaseUrl: "$(DATA_POOL_URL)"
        DataPool__AutoStart: "false"
        DuckCreekForms__ResultsBasePath: '$(TEST_RESULTS_ROOT)\FormsCheck'
        Credentials__Username: "$(CL_EQ_USERNAME)"
        Credentials__Password: "$(CL_EQ_PASSWORD)"
        DuckCreekForms__Username: "$(CL_DC_USERNAME)"
        DUCKCREEK_PASSWORD: "$(CL_DC_PASSWORD)"
        DuckCreekForms__CLASUsername: "$(CL_DC_USERNAME)"
        DuckCreekForms__CLASPassword: "$(CL_DC_PASSWORD)"

    - task: PublishPipelineArtifact@1
      displayName: "Publish preflight evidence"
      condition: always()
      inputs:
        targetPath: "$(TEST_RESULTS_ROOT)"
        artifact: "evidence-preflight-$(System.StageAttempt)-$(System.JobAttempt)"

- stage: Test
  displayName: "Distributed ${{ parameters.suite }} execution"
  dependsOn: Preflight
  condition: and(succeeded(), ${{ eq(parameters.pipelineMode, 'Regression') }})
  jobs:
  - job: ExecuteTests
    displayName: "Execute ${{ parameters.suite }}"
    timeoutInMinutes: 360
    pool:
      name: "Playwright"
    strategy:
      parallel: ${{ parameters.agentCount }}
    variables:
      TEST_RESULTS_ROOT: '$(Agent.TempDirectory)\PnC-Tests-$(Build.BuildId)-$(System.JobPositionInPhase)-$(System.JobAttempt)'
    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: "Download immutable test package"
      inputs:
        artifact: "testpackage"
        targetPath: "$(PACKAGE_ROOT)"

    - task: UseDotNet@2
      displayName: "Install .NET SDK $(DOTNET_VERSION)"
      inputs:
        packageType: sdk
        version: "$(DOTNET_VERSION)"

    - task: VisualStudioTestPlatformInstaller@1
      displayName: "Install VSTest platform"
      inputs:
        packageFeedSelector: nugetOrg
        versionSelector: latestStable

    - task: Cache@2
      displayName: "Cache Playwright Chromium"
      inputs:
        key: 'playwright | "$(Agent.OS)" | "$(PLAYWRIGHT_VERSION)"'
        restoreKeys: |
          playwright | "$(Agent.OS)"
        path: '$(Agent.ToolsDirectory)\playwright-browsers'

    - task: PowerShell@2
      displayName: "Initialize isolated test runtime"
      inputs:
        targetType: filePath
        filePath: '$(PACKAGE_ROOT)\scripts\Initialize-PipelineTestRuntime.ps1'
        arguments: >
          -ArtifactRoot "$(PACKAGE_ROOT)"
          -ResultsRoot "$(TEST_RESULTS_ROOT)"
          -Environment "${{ parameters.environment }}"
          -DataPoolUrl "$(DATA_POOL_URL)"
      env:
        Credentials__Username: "$(CL_EQ_USERNAME)"
        Credentials__Password: "$(CL_EQ_PASSWORD)"
        DuckCreekForms__Username: "$(CL_DC_USERNAME)"
        DUCKCREEK_PASSWORD: "$(CL_DC_PASSWORD)"
        DuckCreekForms__CLASUsername: "$(CL_DC_USERNAME)"
        DuckCreekForms__CLASPassword: "$(CL_DC_PASSWORD)"

    - task: VSTest@3
      displayName: "Execute tests with time-based agent slicing"
      inputs:
        testSelector: testAssemblies
        testAssemblyVer2: |
          **\TestAutomation.dll
          !**\*TestAdapter.dll
        searchFolder: '$(PACKAGE_ROOT)\tests'
        pathtoCustomTestAdapters: '$(PACKAGE_ROOT)\adapters'
        testFiltercriteria: "$(TEST_FILTER)"
        runSettingsFile: '$(PACKAGE_ROOT)\ci.runsettings'
        resultsFolder: '$(TEST_RESULTS_ROOT)\VSTest'
        vsTestVersion: toolsInstaller
        uiTests: true
        runInParallel: false
        distributionBatchType: basedOnExecutionTime
        batchingBasedOnExecutionTimeOption: autoBatchSize
        dontDistribute: false
        diagnosticsEnabled: true
        collectDumpOn: onAbortOnly
        rerunFailedTests: false
        publishRunAttachments: true
        failOnMinTestsNotRun: true
        minimumExpectedTests: "1"
        testRunTitle: "PnC ${{ parameters.suite }} ${{ parameters.environment }} $(Build.BuildNumber)"
      env:
        CI: "true"
        TEST_ENVIRONMENT: "${{ parameters.environment }}"
        TEST_RESULTS_ROOT: "$(TEST_RESULTS_ROOT)"
        PLAYWRIGHT_BROWSERS_PATH: "$(PLAYWRIGHT_BROWSERS_PATH)"
        Playwright__Headless: "true"
        Playwright__BrowserType: "chromium"
        Playwright__TraceEnabled: "true"
        DataPool__BaseUrl: "$(DATA_POOL_URL)"
        DataPool__AutoStart: "false"
        DuckCreekForms__ResultsBasePath: '$(TEST_RESULTS_ROOT)\FormsCheck'
        Credentials__Username: "$(CL_EQ_USERNAME)"
        Credentials__Password: "$(CL_EQ_PASSWORD)"
        DuckCreekForms__Username: "$(CL_DC_USERNAME)"
        DUCKCREEK_PASSWORD: "$(CL_DC_PASSWORD)"
        DuckCreekForms__CLASUsername: "$(CL_DC_USERNAME)"
        DuckCreekForms__CLASPassword: "$(CL_DC_PASSWORD)"

    - task: PublishPipelineArtifact@1
      displayName: "Publish this agent's evidence"
      condition: always()
      inputs:
        targetPath: "$(TEST_RESULTS_ROOT)"
        artifact: "evidence-tests-$(System.JobPositionInPhase)-$(System.StageAttempt)-$(System.JobAttempt)"

  - job: Consolidate
    displayName: "Consolidate test evidence"
    dependsOn: ExecuteTests
    condition: succeededOrFailed()
    timeoutInMinutes: 20
    pool:
      vmImage: "windows-latest"
    steps:
    - checkout: none

    - powershell: |
        New-Item `
          -ItemType Directory `
          -Force `
          -Path "$(Pipeline.Workspace)\consolidated-evidence" |
          Out-Null
      displayName: "Create evidence directory"

    - task: DownloadPipelineArtifact@2
      displayName: "Download all agent evidence"
      continueOnError: true
      inputs:
        buildType: current
        itemPattern: "evidence-*/**"
        targetPath: '$(Pipeline.Workspace)\consolidated-evidence'

    - powershell: |
        $root = "$(Pipeline.Workspace)\consolidated-evidence"
        $files = @(Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue)

        [ordered]@{
          buildId = "$(Build.BuildId)"
          buildNumber = "$(Build.BuildNumber)"
          environment = "${{ parameters.environment }}"
          suite = "${{ parameters.suite }}"
          requestedAgents = ${{ parameters.agentCount }}
          evidenceFileCount = $files.Count
          collectedUtc = [DateTime]::UtcNow.ToString("O")
        } |
          ConvertTo-Json |
          Set-Content (Join-Path $root "evidence-manifest.json") -Encoding UTF8

        Write-Host "Collected $($files.Count) evidence files."
      displayName: "Write evidence manifest"
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: "Publish consolidated evidence"
      condition: always()
      inputs:
        targetPath: '$(Pipeline.Workspace)\consolidated-evidence'
        artifact: "consolidated-test-evidence"

- stage: FormsDeltaReview
  displayName: "Forms delta review"
  dependsOn: []
  condition: and(succeeded(), ${{ eq(parameters.pipelineMode, 'FormsDelta') }})
  pool:
    name: "Playwright"
  jobs:
  - job: ReviewFormsDelta
    displayName: "Acquire pinned workbooks and review Forms changes"
    timeoutInMinutes: 45
    steps:
    - checkout: self
      clean: true

    - powershell: |
        $expected = "refs/heads/$env:EXPECTED_BRANCH"
        if ("$(Build.SourceBranch)" -ne $expected) {
          throw "Queued branch must be '$expected'."
        }
      displayName: "Validate queued branch"
      env:
        EXPECTED_BRANCH: ${{ parameters.branch }}

    - task: UseDotNet@2
      displayName: "Install .NET SDK"
      inputs:
        packageType: sdk
        version: "$(DOTNET_VERSION)"

    - powershell: |
        dotnet restore TestAutomation.csproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build TestAutomation.csproj `
          --configuration "$(BUILD_CONFIGURATION)" `
          --no-restore
        exit $LASTEXITCODE
      displayName: "Restore and build Forms delta tooling"
      env:
        NUGET_PACKAGES: "$(NUGET_PACKAGES)"

    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(DELTA_RESULTS_ROOT)" |
          Out-Null
      displayName: "Create Forms delta results directory"

    - task: PowerShell@2
      name: RunFormsDelta
      displayName: "Run Forms delta review"
      inputs:
        targetType: filePath
        filePath: '$(Build.SourcesDirectory)\Scripts\Invoke-FormsDeltaReview.ps1'
        arguments: >
          -ProjectRoot "$(Build.SourcesDirectory)"
          -ResultRoot "$(DELTA_RESULTS_ROOT)"
      env:
        FORMS_DELTA_SOURCE_FAMILY: ${{ parameters.sourceFamily }}
        FORMS_DELTA_EVENT_ID: ${{ parameters.eventId }}
        FORMS_DELTA_CORRELATION_ID: ${{ parameters.correlationId }}
        FORMS_DELTA_PREVIOUS_SOURCE_IDENTITY: ${{ parameters.previousSourceIdentity }}
        FORMS_DELTA_PREVIOUS_SOURCE_REFERENCE: ${{ parameters.previousSourceReference }}
        FORMS_DELTA_PREVIOUS_SOURCE_SHA256: ${{ parameters.previousSourceSha256 }}
        FORMS_DELTA_CURRENT_SOURCE_IDENTITY: ${{ parameters.currentSourceIdentity }}
        FORMS_DELTA_CURRENT_SOURCE_REFERENCE: ${{ parameters.currentSourceReference }}
        FORMS_DELTA_CURRENT_SOURCE_SHA256: ${{ parameters.currentSourceSha256 }}
        FORMS_DELTA_COUNTERPART_SOURCE_IDENTITY: ${{ parameters.counterpartSourceIdentity }}
        FORMS_DELTA_COUNTERPART_SOURCE_REFERENCE: ${{ parameters.counterpartSourceReference }}
        FORMS_DELTA_COUNTERPART_SOURCE_SHA256: ${{ parameters.counterpartSourceSha256 }}
        FORMS_DELTA_APPROVED_BASELINE_SHA256: ${{ parameters.approvedBaselineSha256 }}
        FORMS_DELTA_ALLOW_REVIEWED_CHANGES: ${{ parameters.allowReviewedChanges }}
        FORMS_DELTA_WRITE_PACKAGE: ${{ parameters.writePackage }}
        FORMS_DELTA_OVERWRITE: ${{ parameters.overwriteExisting }}
        FORMS_SHAREPOINT_ACQUISITION_PROVIDER: $(FORMS_SHAREPOINT_ACQUISITION_PROVIDER)
        FORMS_SHAREPOINT_TENANT_ID: $(FORMS_SHAREPOINT_TENANT_ID)
        FORMS_SHAREPOINT_CLIENT_ID: $(FORMS_SHAREPOINT_CLIENT_ID)
        FORMS_SHAREPOINT_FEDERATED_TOKEN_FILE: $(FORMS_SHAREPOINT_FEDERATED_TOKEN_FILE)
        FORMS_SHAREPOINT_CERTIFICATE_THUMBPRINT: $(FORMS_SHAREPOINT_CERTIFICATE_THUMBPRINT)

    - task: PublishPipelineArtifact@1
      displayName: "Publish Forms delta diagnostics"
      condition: always()
      inputs:
        targetPath: '$(DELTA_RESULTS_ROOT)'
        artifact: "FormsDeltaDiagnostics"

    - task: PublishPipelineArtifact@1
      displayName: "Publish generated Forms delta review package"
      condition: and(
        succeeded(),
        eq(variables['FormsDeltaStatus'], 'Generated'),
        ${{ eq(parameters.allowReviewedChanges, true) }},
        ${{ eq(parameters.writePackage, true) }})
      inputs:
        targetPath: '$(DELTA_RESULTS_ROOT)\review-package'
        artifact: "FormsDeltaReviewPackage"

    - powershell: |
        $tempRoot = "$(Agent.TempDirectory)"
        Get-ChildItem -LiteralPath $tempRoot -Directory -Filter "FormsDelta-*" `
          -ErrorAction SilentlyContinue |
          Remove-Item -Recurse -Force
      displayName: "Clean Forms delta temporary files"
      condition: always()

# Compatibility entry point for the existing main-branch private-agent schedules.
trigger: none
pr: none

schedules:
  - cron: "0 4 * * *"
    displayName: "Nightly Run - 10:00 PM CST"
    branches:
      include:
        - main
    always: true
  - cron: "0 11 * * *"
    displayName: "Morning Run - 5:00 AM CST"
    branches:
      include:
        - main
    always: true

parameters:
  - name: smokeMode
    displayName: "Smoke Mode"
    type: boolean
    default: false

pool:
  name: Playwright

stages:
  - template: templates/build-package-stage.yml

  - template: templates/test-shards-stage.yml
    parameters:
      maxParallel: 2
      matrix:
        Basic1:
          SHARD_ID: Basic1
          DEBUG_MODE: ${{ parameters.smokeMode }}
        Basic2:
          SHARD_ID: Basic2
          DEBUG_MODE: ${{ parameters.smokeMode }}
        Basic3:
          SHARD_ID: Basic3
          DEBUG_MODE: ${{ parameters.smokeMode }}
        BasicMisc:
          SHARD_ID: BasicMisc
          DEBUG_MODE: ${{ parameters.smokeMode }}
        CE4:
          SHARD_ID: CE4
          DEBUG_MODE: ${{ parameters.smokeMode }}
        CE5:
          SHARD_ID: CE5
          DEBUG_MODE: ${{ parameters.smokeMode }}
        CE6:
          SHARD_ID: CE6
          DEBUG_MODE: ${{ parameters.smokeMode }}

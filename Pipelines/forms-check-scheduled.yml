# Azure DevOps Pipeline: Forms Checking (Manual)
# Run manually from Azure DevOps — no automatic schedule.
#
# Set pipeline variables in Azure DevOps:
#   DUCKCREEK_PASSWORD  (secret) — DuckCreek Basic Auth password
#   TEST_ENVIRONMENT    (plain)  — QA | DEV | STG  (defaults to QA)

trigger: none
schedules: []   # Schedules disabled — manual runs only

pool:
  name: "Default"

variables:
  - name: TEST_ENVIRONMENT
    value: "QA"
  - name: DOTNET_VERSION
    value: "8.x"

stages:
  - stage: FormsCheck
    displayName: "DuckCreek Forms Validation"
    jobs:
      - job: SFP_FormsCheck
        displayName: "SFP Forms Check"
        steps:
          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              packageType: sdk
              version: $(DOTNET_VERSION)

          - script: dotnet restore TestAutomation.csproj
            displayName: "Restore NuGet packages"

          - script: dotnet build TestAutomation.csproj --configuration Release --no-restore
            displayName: "Build project"

          - script: |
              dotnet test TestAutomation.csproj ^
                --configuration Release ^
                --no-build ^
                --filter "Category=Forms&Category=SFP" ^
                --logger "trx;LogFileName=SFP_FormsResults.trx" ^
                --results-directory $(Build.ArtifactStagingDirectory)/TestResults
            displayName: "Run SFP Forms Validation"
            env:
              DUCKCREEK_PASSWORD: $(DUCKCREEK_PASSWORD)
              TEST_ENVIRONMENT: $(TEST_ENVIRONMENT)

          - task: PublishTestResults@2
            displayName: "Publish SFP Forms Test Results"
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "$(Build.ArtifactStagingDirectory)/TestResults/*.trx"
              mergeTestResults: true
              testRunTitle: "SFP Forms Validation"

          - publish: $(Build.SourcesDirectory)/TestResults
            displayName: "Publish SFP Forms HTML Reports"
            artifact: "SFP_FormsResults"
            condition: always()

      - job: CE_FormsCheck
        displayName: "Country Estate Forms Check"
        steps:
          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              packageType: sdk
              version: $(DOTNET_VERSION)

          - script: dotnet restore TestAutomation.csproj
            displayName: "Restore NuGet packages"

          - script: dotnet build TestAutomation.csproj --configuration Release --no-restore
            displayName: "Build project"

          - script: |
              dotnet test TestAutomation.csproj ^
                --configuration Release ^
                --no-build ^
                --filter "Category=Forms&Category=CE" ^
                --logger "trx;LogFileName=CE_FormsResults.trx" ^
                --results-directory $(Build.ArtifactStagingDirectory)/TestResults
            displayName: "Run Country Estate Forms Validation"
            env:
              DUCKCREEK_PASSWORD: $(DUCKCREEK_PASSWORD)
              TEST_ENVIRONMENT: $(TEST_ENVIRONMENT)

          - task: PublishTestResults@2
            displayName: "Publish CE Forms Test Results"
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "$(Build.ArtifactStagingDirectory)/TestResults/*.trx"
              mergeTestResults: true
              testRunTitle: "CE Forms Validation"

          - publish: $(Build.SourcesDirectory)/TestResults
            displayName: "Publish CE Forms HTML Reports"
            artifact: "CE_FormsResults"
            condition: always()

# Compatibility entry point for the manual SFP forms validation job.
# The former CE filter discovered zero tests and is intentionally not retained.
trigger: none
pr: none
schedules: []

pool:
  name: Default

variables:
  DATAPOOL_BASE_URL: ""
  DATAPOOL_API_KEY: ""

parameters:
  - name: testPlanPublishMode
    displayName: "Azure Test Plans publication"
    type: string
    default: Off
    values:
      - Off
      - Dry-Run
      - Publish
  - name: testPlanMappingSecureFile
    displayName: "Azure Test Plans mapping secure-file name"
    type: string
    default: ""

stages:
  - template: templates/build-package-stage.yml

  - template: templates/test-shards-stage.yml
    parameters:
      maxParallel: 1
      dataPoolRequired: false
      testPlanPublishMode: ${{ parameters.testPlanPublishMode }}
      testPlanMappingSecureFile: ${{ parameters.testPlanMappingSecureFile }}
      matrix:
        FormsSfp:
          SHARD_ID: FormsSfp
          DEBUG_MODE: false

# Azure DevOps Pipeline: Scheduled Forms Checking
# Mirrors the Tosca execution schedules for automated forms validation.
#
# Schedule (CST → UTC):
#   SFP Daily:           11:30 AM CST = 17:30 UTC  (Mon–Fri)
#   Country Estate Daily: 12:45 PM CST = 18:45 UTC  (Mon–Fri)
#
# Set pipeline variables in Azure DevOps:
#   DUCKCREEK_PASSWORD  (secret) — DuckCreek Basic Auth password
#   TEST_ENVIRONMENT    (plain)  — QA | DEV | STG  (defaults to QA)

trigger: none          # No CI trigger — schedule only

schedules:
  - cron: "30 17 * * 1-5"     # SFP at 11:30 AM CST (Mon–Fri)
    displayName: "SFP Forms Check – Daily 11:30 AM CST"
    branches:
      include: [ main ]
    always: true

  - cron: "45 18 * * 1-5"     # Country Estate at 12:45 PM CST (Mon–Fri)
    displayName: "Country Estate Forms Check – Daily 12:45 PM CST"
    branches:
      include: [ main ]
    always: true

pool:
  vmImage: "windows-latest"

variables:
  - name: TEST_ENVIRONMENT
    value: "QA"
  - name: DOTNET_VERSION
    value: "8.x"

stages:
  - stage: FormsCheck
    displayName: "DuckCreek Forms Validation"
    jobs:
      - job: SFP_FormsCheck
        displayName: "SFP Forms Check"
        condition: |
          or(
            eq(variables['Build.CronSchedule.DisplayName'], 'SFP Forms Check – Daily 11:30 AM CST'),
            eq(variables['Build.Reason'], 'Manual')
          )
        steps:
          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              packageType: sdk
              version: $(DOTNET_VERSION)

          - script: dotnet restore TestAutomation.csproj
            displayName: "Restore NuGet packages"

          - script: dotnet build TestAutomation.csproj --configuration Release --no-restore
            displayName: "Build project"

          - script: |
              dotnet test TestAutomation.csproj ^
                --configuration Release ^
                --no-build ^
                --filter "Category=FormsCheck&Category=SFP" ^
                --logger "trx;LogFileName=SFP_FormsResults.trx" ^
                --results-directory $(Build.ArtifactStagingDirectory)/TestResults
            displayName: "Run SFP Forms Validation"
            env:
              DUCKCREEK_PASSWORD: $(DUCKCREEK_PASSWORD)
              TEST_ENVIRONMENT: $(TEST_ENVIRONMENT)

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "$(Build.ArtifactStagingDirectory)/TestResults/*.trx"
              mergeTestResults: true

          - publish: TestResults/FormsCheck
            displayName: "Publish Forms CSV Results"
            artifact: "SFP_FormsResults"
            condition: always()

      - job: CE_FormsCheck
        displayName: "Country Estate Forms Check"
        condition: |
          or(
            eq(variables['Build.CronSchedule.DisplayName'], 'Country Estate Forms Check – Daily 12:45 PM CST'),
            eq(variables['Build.Reason'], 'Manual')
          )
        steps:
          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              packageType: sdk
              version: $(DOTNET_VERSION)

          - script: dotnet restore TestAutomation.csproj
            displayName: "Restore NuGet packages"

          - script: dotnet build TestAutomation.csproj --configuration Release --no-restore
            displayName: "Build project"

          - script: |
              dotnet test TestAutomation.csproj ^
                --configuration Release ^
                --no-build ^
                --filter "Category=FormsCheck&Category=CE" ^
                --logger "trx;LogFileName=CE_FormsResults.trx" ^
                --results-directory $(Build.ArtifactStagingDirectory)/TestResults
            displayName: "Run Country Estate Forms Validation"
            env:
              DUCKCREEK_PASSWORD: $(DUCKCREEK_PASSWORD)
              TEST_ENVIRONMENT: $(TEST_ENVIRONMENT)

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            condition: always()
            inputs:
              testResultsFormat: "VSTest"
              testResultsFiles: "$(Build.ArtifactStagingDirectory)/TestResults/*.trx"
              mergeTestResults: true

          - publish: TestResults/FormsCheck
            displayName: "Publish Forms CSV Results"
            artifact: "CE_FormsResults"
            condition: always()

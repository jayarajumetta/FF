name: $(Date:yyyyMMdd).$(Rev:r)
trigger: none
pr: none

parameters:
- name: buildPipelineDefinitionId
  type: string
  default: '0'
- name: testPlanId
  type: string
  default: '0'
- name: singleTestCaseId
  type: string
  default: '0'
- name: singleCaseParentSuiteId
  type: string
  default: '0'
- name: suiteId
  type: string
  default: '0'
- name: testConfigurationId
  type: string
  default: '0'
- name: testFilter
  type: string
  default: ''
- name: headless
  type: boolean
  default: true
- name: runSingleTestCase
  type: boolean
  default: false
- name: runTestPlanSuite
  type: boolean
  default: false
- name: runDllOrTags
  type: boolean
  default: true

pool:
  vmImage: windows-latest

variables:
  ArtifactName: testpackage
  ArtifactRoot: '$(Pipeline.Workspace)\testpackage'

stages:
- stage: SingleTestPlanCase
  displayName: Execute selected Test Plan case
  condition: and(succeeded(), eq(${{ parameters.runSingleTestCase }}, true))
  jobs:
  - job: RunSingleCase
    steps:
    - checkout: none
    - task: UseDotNet@2
      inputs: { packageType: sdk, version: '8.0.x' }
      displayName: Install .NET 8
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: specific
        project: '$(System.TeamProject)'
        definition: '${{ parameters.buildPipelineDefinitionId }}'
        buildVersionToDownload: latest
        artifactName: '$(ArtifactName)'
        targetPath: '$(ArtifactRoot)'
      displayName: Download test artifact
    - powershell: '& "$(ArtifactRoot)\.azuredevops\scripts\Initialize-TestRuntime.ps1" -ArtifactRoot "$(ArtifactRoot)" -EvidenceRoot "$(Pipeline.Workspace)\evidence\SingleCase" -Headless $${{ parameters.headless }}'
      displayName: Prepare test runtime
    - powershell: '& "$(ArtifactRoot)\.azuredevops\scripts\New-AdoSingleCaseSuite.ps1" -PlanId ${{ parameters.testPlanId }} -ParentSuiteId ${{ parameters.singleCaseParentSuiteId }} -TestCaseId ${{ parameters.singleTestCaseId }} -ConfigurationId ${{ parameters.testConfigurationId }}'
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: Create temporary single-case suite
    - task: VSTest@3
      inputs:
        testSelector: testPlan
        testPlan: '${{ parameters.testPlanId }}'
        testSuite: '$(PIPELINE_SINGLE_CASE_SUITE_ID)'
        testConfiguration: '${{ parameters.testConfigurationId }}'
        searchFolder: '$(ArtifactRoot)'
        runSettingsFile: '$(VSTEST_RUNSETTINGS)'
        resultsFolder: '$(Agent.TempDirectory)\TestResults\SingleCase'
        publishRunAttachments: true
      env:
        CL_DC_USERNAME: $(CL_DC_USERNAME)
        CL_DC_PASSWORD: $(CL_DC_PASSWORD)
        CL_EQ_USERNAME: $(CL_EQ_USERNAME)
        CL_EQ_PASSWORD: $(CL_EQ_PASSWORD)
        PL_DC_USERNAME: $(PL_DC_USERNAME)
        PL_DC_PASSWORD: $(PL_DC_PASSWORD)
      displayName: Execute selected Test Plan case
    - powershell: '& "$(ArtifactRoot)\.azuredevops\scripts\Remove-AdoTemporarySuite.ps1" -PlanId ${{ parameters.testPlanId }} -SuiteId $(PIPELINE_SINGLE_CASE_SUITE_ID)'
      condition: always()
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: Remove temporary suite
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)\TestResults\SingleCase\**\*.trx'
        publishRunAttachments: true
        testRunTitle: 'Single Test Plan Case $(Build.BuildNumber)'
    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: '$(Pipeline.Workspace)\evidence\SingleCase'
        artifact: 'evidence-single-case'

- stage: TestPlanSuite
  displayName: Execute Test Plan suite
  condition: and(succeeded(), eq(${{ parameters.runTestPlanSuite }}, true))
  jobs:
  - job: RunSuite
    steps:
    - checkout: none
    - task: UseDotNet@2
      inputs: { packageType: sdk, version: '8.0.x' }
      displayName: Install .NET 8
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: specific
        project: '$(System.TeamProject)'
        definition: '${{ parameters.buildPipelineDefinitionId }}'
        buildVersionToDownload: latest
        artifactName: '$(ArtifactName)'
        targetPath: '$(ArtifactRoot)'
      displayName: Download test artifact
    - powershell: '& "$(ArtifactRoot)\.azuredevops\scripts\Initialize-TestRuntime.ps1" -ArtifactRoot "$(ArtifactRoot)" -EvidenceRoot "$(Pipeline.Workspace)\evidence\Suite" -Headless $${{ parameters.headless }}'
      displayName: Prepare test runtime
    - task: VSTest@3
      inputs:
        testSelector: testPlan
        testPlan: '${{ parameters.testPlanId }}'
        testSuite: '${{ parameters.suiteId }}'
        testConfiguration: '${{ parameters.testConfigurationId }}'
        searchFolder: '$(ArtifactRoot)'
        runSettingsFile: '$(VSTEST_RUNSETTINGS)'
        resultsFolder: '$(Agent.TempDirectory)\TestResults\Suite'
        publishRunAttachments: true
      env:
        CL_DC_USERNAME: $(CL_DC_USERNAME)
        CL_DC_PASSWORD: $(CL_DC_PASSWORD)
        CL_EQ_USERNAME: $(CL_EQ_USERNAME)
        CL_EQ_PASSWORD: $(CL_EQ_PASSWORD)
        PL_DC_USERNAME: $(PL_DC_USERNAME)
        PL_DC_PASSWORD: $(PL_DC_PASSWORD)
      displayName: Execute Test Plan suite
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)\TestResults\Suite\**\*.trx'
        publishRunAttachments: true
        testRunTitle: 'Test Plan Suite $(Build.BuildNumber)'
    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: '$(Pipeline.Workspace)\evidence\Suite'
        artifact: 'evidence-suite'

- stage: TestDllOrTags
  displayName: Execute DLL / tag filter
  condition: and(succeeded(), eq(${{ parameters.runDllOrTags }}, true))
  jobs:
  - job: RunDll
    steps:
    - checkout: none
    - task: UseDotNet@2
      inputs: { packageType: sdk, version: '8.0.x' }
      displayName: Install .NET 8
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: specific
        project: '$(System.TeamProject)'
        definition: '${{ parameters.buildPipelineDefinitionId }}'
        buildVersionToDownload: latest
        artifactName: '$(ArtifactName)'
        targetPath: '$(ArtifactRoot)'
      displayName: Download test artifact
    - powershell: '& "$(ArtifactRoot)\.azuredevops\scripts\Initialize-TestRuntime.ps1" -ArtifactRoot "$(ArtifactRoot)" -EvidenceRoot "$(Pipeline.Workspace)\evidence\Dll" -Headless $${{ parameters.headless }}'
      displayName: Prepare test runtime
    - task: VSTest@3
      inputs:
        testSelector: testAssemblies
        testAssemblyVer2: |
          **\tests\**\bin\Release\net8.0\*Tests.dll
          !**\*TestAdapter.dll
          !**\obj\**
        searchFolder: '$(ArtifactRoot)'
        resultsFolder: '$(Agent.TempDirectory)\TestResults\Dll'
        testFiltercriteria: '${{ parameters.testFilter }}'
        runSettingsFile: '$(VSTEST_RUNSETTINGS)'
        publishRunAttachments: true
      env:
        CL_DC_USERNAME: $(CL_DC_USERNAME)
        CL_DC_PASSWORD: $(CL_DC_PASSWORD)
        CL_EQ_USERNAME: $(CL_EQ_USERNAME)
        CL_EQ_PASSWORD: $(CL_EQ_PASSWORD)
        PL_DC_USERNAME: $(PL_DC_USERNAME)
        PL_DC_PASSWORD: $(PL_DC_PASSWORD)
      displayName: Execute compiled tests
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)\TestResults\Dll\**\*.trx'
        publishRunAttachments: true
        testRunTitle: 'DLL / Tags $(Build.BuildNumber)'
    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: '$(Pipeline.Workspace)\evidence\Dll'
        artifact: 'evidence-dll'

- stage: ConsolidatedReportAndEmail
  displayName: Consolidate execution evidence and send email
  dependsOn: [SingleTestPlanCase, TestPlanSuite, TestDllOrTags]
  condition: always()
  jobs:
  - job: ConsolidateAndEmail
    steps:
    - checkout: none
    - task: UsePythonVersion@0
      displayName: Install Python
      inputs:
        versionSpec: '3.x'
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: specific
        project: '$(System.TeamProject)'
        definition: '${{ parameters.buildPipelineDefinitionId }}'
        buildVersionToDownload: latest
        artifactName: '$(ArtifactName)'
        targetPath: '$(ArtifactRoot)'
      displayName: Download reporting source and scripts
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: current
        targetPath: '$(Pipeline.Workspace)\all-evidence'
      continueOnError: true
      displayName: Download all execution evidence artifacts
    - powershell: |
        $output = '$(Pipeline.Workspace)\consolidated-report'
        python "$(ArtifactRoot)\tools\generate_consolidated_report.py" `
          --evidence-root "$(Pipeline.Workspace)\all-evidence" `
          --source-root "$(ArtifactRoot)" `
          --output-dir "$output"
        if ($LASTEXITCODE -ne 0) { throw 'Consolidated report generation failed' }
      displayName: Generate Robot-style consolidated HTML report
    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: '$(Pipeline.Workspace)\consolidated-report'
        artifact: 'consolidated-test-report'
      displayName: Publish consolidated report
    - powershell: |
        if ([string]::IsNullOrWhiteSpace($env:SMTP_HOST) -or
            [string]::IsNullOrWhiteSpace($env:SMTP_FROM) -or
            [string]::IsNullOrWhiteSpace($env:SMTP_TO)) {
          Write-Host 'SMTP variables are not configured; consolidated report remains available as a pipeline artifact.'
          exit 0
        }
        python "$(ArtifactRoot)\tools\send_consolidated_report.py" `
          --report-dir "$(Pipeline.Workspace)\consolidated-report" `
          --subject "Insurance automation $(Build.BuildNumber)"
        if ($LASTEXITCODE -ne 0) { throw 'SMTP delivery failed' }
      env:
        SMTP_HOST: $(SMTP_HOST)
        SMTP_PORT: $(SMTP_PORT)
        SMTP_FROM: $(SMTP_FROM)
        SMTP_TO: $(SMTP_TO)
        SMTP_USER: $(SMTP_USER)
        SMTP_PASSWORD: $(SMTP_PASSWORD)
        SMTP_SSL: $(SMTP_SSL)
      displayName: Send consolidated report through SMTP

name: $(Date:yyyyMMdd).$(Rev:r)
trigger: none
pr: none

parameters:
- name: buildPipelineDefinitionId
  type: string
  default: '0'
- name: testPlanId
  type: string
  default: '0'
- name: singleTestCaseId
  type: string
  default: '0'
- name: singleCaseParentSuiteId
  type: string
  default: '0'
- name: suiteId
  type: string
  default: '0'
- name: testConfigurationId
  type: string
  default: '0'
- name: testFilter
  type: string
  default: ''
- name: headless
  type: boolean
  default: true
- name: runSingleTestCase
  type: boolean
  default: false
- name: runTestPlanSuite
  type: boolean
  default: false
- name: runDllOrTags
  type: boolean
  default: true

pool:
  vmImage: windows-latest

variables:
  ArtifactName: testpackage
  ArtifactRoot: '$(Pipeline.Workspace)\testpackage'
  ResultsDirectory: 'TestResults'

stages:
- stage: SingleTestPlanCase
  displayName: Execute selected Test Plan case
  condition: and(succeeded(), eq(${{ parameters.runSingleTestCase }}, true))
  jobs:
  - job: RunSingleCase
    steps:
    - checkout: none
    - task: UseDotNet@2
      inputs: { packageType: sdk, version: '8.0.x' }
      displayName: Install .NET 8
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: specific
        project: '$(System.TeamProject)'
        definition: '${{ parameters.buildPipelineDefinitionId }}'
        buildVersionToDownload: latest
        artifactName: '$(ArtifactName)'
        targetPath: '$(ArtifactRoot)'
      displayName: Download test artifact
    - powershell: |
        $zipPath = "$(ArtifactRoot)\testpackage-runready.zip"
        if (Test-Path -LiteralPath $zipPath) {
          Expand-Archive -LiteralPath $zipPath -DestinationPath "$(ArtifactRoot)" -Force
          Write-Host "Extracted run-ready zip: $zipPath"
        }
        else {
          Write-Host 'Run-ready zip not found; using downloaded folder content as-is.'
        }
      displayName: Ensure run-ready artifact is extracted
    - powershell: |
        $ErrorActionPreference = 'Stop'

        $configFiles = Get-ChildItem "$(ArtifactRoot)\tests" -Recurse -File -Filter framework.json |
          Where-Object { $_.FullName -match '\\bin\\Release\\net8.0\\config\\framework.json$' }
        if (-not $configFiles) { throw 'No compiled framework.json files found in artifact.' }

        foreach ($configFile in $configFiles) {
          $config = Get-Content -Raw -LiteralPath $configFile.FullName | ConvertFrom-Json
          $config.browser.headless = [System.Convert]::ToBoolean('${{ parameters.headless }}')
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configFile.FullName -Encoding UTF8
        }

        $playwright = Get-ChildItem "$(ArtifactRoot)\tests" -Recurse -File -Filter playwright.ps1 |
          Where-Object { Test-Path (Join-Path $_.Directory.FullName 'Microsoft.Playwright.dll') } |
          Select-Object -First 1 -ExpandProperty FullName
        if (-not $playwright) { throw 'No playable playwright.ps1 + Microsoft.Playwright.dll pair found in artifact.' }
        & $playwright install chromium
        if ($LASTEXITCODE -ne 0) { throw 'Playwright browser installation failed' }

        $runsettings = Join-Path "$(ArtifactRoot)" 'Tosca.runsettings'
        if (-not (Test-Path -LiteralPath $runsettings)) { throw 'Tosca.runsettings is missing from compiled artifact.' }
        & "$(ArtifactRoot)\scripts\Initialize-PipelineTestOutput.ps1" -ArtifactRoot "$(ArtifactRoot)" -ResultsDirectory "$(ResultsDirectory)\SingleCase"
      displayName: Prepare test runtime
    - powershell: |
        $ErrorActionPreference = 'Stop'
        $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
        $collectionUri = $env:SYSTEM_COLLECTIONURI.TrimEnd('/')
        $project = $env:SYSTEM_TEAMPROJECT
        $planId = '${{ parameters.testPlanId }}'
        $parentSuiteId = '${{ parameters.singleCaseParentSuiteId }}'
        $testCaseId = '${{ parameters.singleTestCaseId }}'

        $suiteName = "Pipeline SingleCase $env:BUILD_BUILDID TC$testCaseId"
        $createSuiteUri = "$collectionUri/$project/_apis/testplan/Plans/$planId/suites/$parentSuiteId?api-version=7.1-preview.1"
        $createSuiteBody = @{ suiteType = 'StaticTestSuite'; name = $suiteName } | ConvertTo-Json
        $createdSuite = Invoke-RestMethod -Method Post -Uri $createSuiteUri -Headers $headers -ContentType 'application/json' -Body $createSuiteBody
        $suiteId = [string]$createdSuite.id
        if ([string]::IsNullOrWhiteSpace($suiteId)) { throw 'Failed to create temporary single-case suite.' }

        $addTestCaseUri = "$collectionUri/$project/_apis/test/Plans/$planId/suites/$suiteId/testcases/$testCaseId?api-version=7.1-preview.2"
        Invoke-RestMethod -Method Post -Uri $addTestCaseUri -Headers $headers | Out-Null
        Write-Host "##vso[task.setvariable variable=PIPELINE_SINGLE_CASE_SUITE_ID]$suiteId"
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        SYSTEM_COLLECTIONURI: $(System.CollectionUri)
        SYSTEM_TEAMPROJECT: $(System.TeamProject)
      displayName: Create temporary single-case suite
    - task: VSTest@3
      inputs:
        testSelector: testPlan
        testPlan: '${{ parameters.testPlanId }}'
        testSuite: '$(PIPELINE_SINGLE_CASE_SUITE_ID)'
        testConfiguration: '${{ parameters.testConfigurationId }}'
        searchFolder: '$(ArtifactRoot)'
        runSettingsFile: '$(VSTEST_RUNSETTINGS)'
        resultsFolder: '$(ArtifactRoot)\$(ResultsDirectory)\SingleCase\Runner'
        publishRunAttachments: true
      env:
        CL_DC_USERNAME: $(CL_DC_USERNAME)
        CL_DC_PASSWORD: $(CL_DC_PASSWORD)
        CL_EQ_USERNAME: $(CL_EQ_USERNAME)
        CL_EQ_PASSWORD: $(CL_EQ_PASSWORD)
        PL_DC_USERNAME: $(PL_DC_USERNAME)
        PL_DC_PASSWORD: $(PL_DC_PASSWORD)
      displayName: Execute selected Test Plan case
    - powershell: |
        $ErrorActionPreference = 'Continue'
        if ([string]::IsNullOrWhiteSpace('$(PIPELINE_SINGLE_CASE_SUITE_ID)')) {
          Write-Host 'Temporary suite id is empty; cleanup skipped.'
          exit 0
        }
        $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
        $collectionUri = $env:SYSTEM_COLLECTIONURI.TrimEnd('/')
        $project = $env:SYSTEM_TEAMPROJECT
        $planId = '${{ parameters.testPlanId }}'
        $suiteId = '$(PIPELINE_SINGLE_CASE_SUITE_ID)'
        $deleteUri = "$collectionUri/$project/_apis/testplan/Plans/$planId/suites/$suiteId?api-version=7.1-preview.1"
        try { Invoke-RestMethod -Method Delete -Uri $deleteUri -Headers $headers | Out-Null }
        catch { Write-Warning "Temporary suite cleanup failed: $($_.Exception.Message)" }
      condition: always()
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        SYSTEM_COLLECTIONURI: $(System.CollectionUri)
        SYSTEM_TEAMPROJECT: $(System.TeamProject)
      displayName: Remove temporary suite
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(ArtifactRoot)\$(ResultsDirectory)\SingleCase\Runner\**\*.trx'
        publishRunAttachments: true
        testRunTitle: 'Single Test Plan Case $(Build.BuildNumber)'
    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: '$(ArtifactRoot)\$(ResultsDirectory)\SingleCase'
        artifact: 'evidence-single-case'


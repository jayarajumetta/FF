- stage: TestDllOrTags
  displayName: Execute DLL / tag filter
  condition: and(succeeded(), eq(${{ parameters.runDllOrTags }}, true))
  jobs:
  - job: RunDll
    steps:
    - checkout: none
    - task: UseDotNet@2
      inputs: { packageType: sdk, version: '8.0.x' }
      displayName: Install .NET 8
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: specific
        project: '$(System.TeamProject)'
        definition: '${{ parameters.buildPipelineDefinitionId }}'
        buildVersionToDownload: latest
        artifactName: '$(ArtifactName)'
        targetPath: '$(ArtifactRoot)'
      displayName: Download test artifact
    - powershell: |
        $zipPath = "$(ArtifactRoot)\testpackage-runready.zip"
        if (Test-Path -LiteralPath $zipPath) {
          Expand-Archive -LiteralPath $zipPath -DestinationPath "$(ArtifactRoot)" -Force
          Write-Host "Extracted run-ready zip: $zipPath"
        }
        else {
          Write-Host 'Run-ready zip not found; using downloaded folder content as-is.'
        }
      displayName: Ensure run-ready artifact is extracted
    - powershell: |
        $ErrorActionPreference = 'Stop'

        $configFiles = Get-ChildItem "$(ArtifactRoot)\tests" -Recurse -File -Filter framework.json |
          Where-Object { $_.FullName -match '\\bin\\Release\\net8.0\\config\\framework.json$' }
        if (-not $configFiles) { throw 'No compiled framework.json files found in artifact.' }
        foreach ($configFile in $configFiles) {
          $config = Get-Content -Raw -LiteralPath $configFile.FullName | ConvertFrom-Json
          $config.browser.headless = [System.Convert]::ToBoolean('${{ parameters.headless }}')
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configFile.FullName -Encoding UTF8
        }

        $playwright = Get-ChildItem "$(ArtifactRoot)\tests" -Recurse -File -Filter playwright.ps1 |
          Where-Object { Test-Path (Join-Path $_.Directory.FullName 'Microsoft.Playwright.dll') } |
          Select-Object -First 1 -ExpandProperty FullName
        if (-not $playwright) { throw 'No playable playwright.ps1 + Microsoft.Playwright.dll pair found in artifact.' }
        & $playwright install chromium
        if ($LASTEXITCODE -ne 0) { throw 'Playwright browser installation failed' }

        $runsettings = Join-Path "$(ArtifactRoot)" 'Tosca.runsettings'
        if (-not (Test-Path -LiteralPath $runsettings)) { throw 'Tosca.runsettings is missing from compiled artifact.' }
        & "$(ArtifactRoot)\scripts\Initialize-PipelineTestOutput.ps1" -ArtifactRoot "$(ArtifactRoot)" -ResultsDirectory "$(ResultsDirectory)\Dll"
      displayName: Prepare test runtime
    - task: VSTest@3
      inputs:
        testSelector: testAssemblies
        testAssemblyVer2: |
          **\tests\**\bin\Release\net8.0\*Tests.dll
          !**\*TestAdapter.dll
          !**\obj\**
        searchFolder: '$(ArtifactRoot)'
        resultsFolder: '$(ArtifactRoot)\$(ResultsDirectory)\Dll\Runner'
        testFiltercriteria: '${{ parameters.testFilter }}'
        runSettingsFile: '$(VSTEST_RUNSETTINGS)'
        publishRunAttachments: true
      env:
        CL_DC_USERNAME: $(CL_DC_USERNAME)
        CL_DC_PASSWORD: $(CL_DC_PASSWORD)
        CL_EQ_USERNAME: $(CL_EQ_USERNAME)
        CL_EQ_PASSWORD: $(CL_EQ_PASSWORD)
        PL_DC_USERNAME: $(PL_DC_USERNAME)
        PL_DC_PASSWORD: $(PL_DC_PASSWORD)
      displayName: Execute compiled tests
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(ArtifactRoot)\$(ResultsDirectory)\Dll\Runner\**\*.trx'
        publishRunAttachments: true
        testRunTitle: 'DLL / Tags $(Build.BuildNumber)'
    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: '$(ArtifactRoot)\$(ResultsDirectory)\Dll'
        artifact: 'evidence-dll'

- stage: ConsolidatedReportAndEmail
  displayName: Consolidate execution evidence and send email
  dependsOn: [SingleTestPlanCase, TestPlanSuite, TestDllOrTags]
  condition: always()
  jobs:
  - job: ConsolidateAndEmail
    steps:
    - checkout: none
    - task: UsePythonVersion@0
      displayName: Install Python
      inputs:
        versionSpec: '3.x'
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: specific
        project: '$(System.TeamProject)'
        definition: '${{ parameters.buildPipelineDefinitionId }}'
        buildVersionToDownload: latest
        artifactName: '$(ArtifactName)'
        targetPath: '$(ArtifactRoot)'
      displayName: Download reporting source and scripts
    - powershell: |
        $zipPath = "$(ArtifactRoot)\testpackage-runready.zip"
        if (Test-Path -LiteralPath $zipPath) {
          Expand-Archive -LiteralPath $zipPath -DestinationPath "$(ArtifactRoot)" -Force
          Write-Host "Extracted run-ready zip: $zipPath"
        }
        else {
          Write-Host 'Run-ready zip not found; using downloaded folder content as-is.'
        }
      displayName: Ensure run-ready artifact is extracted
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: current
        targetPath: '$(ArtifactRoot)\$(ResultsDirectory)\DownloadedEvidence'
      continueOnError: true
      displayName: Download all execution evidence artifacts
    - powershell: |
        $output = '$(ArtifactRoot)\$(ResultsDirectory)\ConsolidatedReport'
        New-Item -ItemType Directory -Force -Path $output | Out-Null
        $reportScript = "$(ArtifactRoot)\tools\generate_consolidated_report.py"
        if (-not (Test-Path -LiteralPath $reportScript)) {
          '{"status":"skipped","reason":"report script not included in compiled artifact"}' | Set-Content -LiteralPath (Join-Path $output 'summary.json') -Encoding UTF8
          Write-Host 'Consolidated report script not found; generated placeholder summary.'
          exit 0
        }
        python $reportScript `
          --evidence-root "$(ArtifactRoot)\$(ResultsDirectory)\DownloadedEvidence" `
          --source-root "$(ArtifactRoot)" `
          --output-dir "$output"
        if ($LASTEXITCODE -ne 0) { throw 'Consolidated report generation failed' }
      displayName: Generate Robot-style consolidated HTML report
    - task: PublishPipelineArtifact@1
      condition: always()
      inputs:
        targetPath: '$(ArtifactRoot)\$(ResultsDirectory)\ConsolidatedReport'
        artifact: 'consolidated-test-report'
      displayName: Publish consolidated report
    - powershell: |
        if ([string]::IsNullOrWhiteSpace($env:SMTP_HOST) -or
            [string]::IsNullOrWhiteSpace($env:SMTP_FROM) -or
            [string]::IsNullOrWhiteSpace($env:SMTP_TO)) {
          Write-Host 'SMTP variables are not configured; consolidated report remains available as a pipeline artifact.'
          exit 0
        }
        $mailScript = "$(ArtifactRoot)\tools\send_consolidated_report.py"
        if (-not (Test-Path -LiteralPath $mailScript)) {
          Write-Host 'SMTP script not found in compiled artifact; skipping email send.'
          exit 0
        }
        python $mailScript `
          --report-dir "$(ArtifactRoot)\$(ResultsDirectory)\ConsolidatedReport" `
          --subject "Insurance automation $(Build.BuildNumber)"
        if ($LASTEXITCODE -ne 0) { throw 'SMTP delivery failed' }
      env:
        SMTP_HOST: $(SMTP_HOST)
        SMTP_PORT: $(SMTP_PORT)
        SMTP_FROM: $(SMTP_FROM)
        SMTP_TO: $(SMTP_TO)
        SMTP_USER: $(SMTP_USER)
        SMTP_PASSWORD: $(SMTP_PASSWORD)
        SMTP_SSL: $(SMTP_SSL)
      displayName: Send consolidated report through SMTP

name: $(Date:yyyyMMdd).$(Rev:r)
trigger:
  branches:
    include: [main,sgs/develop]
pr:
  branches:
    include: [main,sgs/develop]

pool:
  vmImage: windows-latest

variables:
  BuildConfiguration: Release
  ArtifactName: testpackage

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: Install .NET 8 SDK
  inputs:
    packageType: sdk
    version: 8.0.x

- task: UsePythonVersion@0
  displayName: Install Python
  inputs:
    versionSpec: '3.11'

- powershell: |
    python --version
    python -m pip install --upgrade pip
    python -m pip install pyyaml
    if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }
  displayName: Install Python dependencies

- powershell: |
    dotnet restore .\ToscaCanonicalSimple.sln
    if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed' }
    dotnet build .\ToscaCanonicalSimple.sln -c $(BuildConfiguration) --no-restore
    if ($LASTEXITCODE -ne 0) { throw 'dotnet build failed' }
  displayName: Restore and build solution

- powershell: |
    $playwright = "$(Build.SourcesDirectory)\\src\\InsuranceAutomation.Core\\bin\\$(BuildConfiguration)\\net8.0\\playwright.ps1"
    if (-not (Test-Path $playwright)) { throw "playwright.ps1 was not produced by the build at $playwright" }
    & $playwright install chromium
    if ($LASTEXITCODE -ne 0) { throw 'Playwright browser installation failed' }
  displayName: Validate Playwright browser installation

- powershell: |
    python .\tools\package_gate.py
    if ($LASTEXITCODE -ne 0) { throw 'Client package quality gate failed' }
  displayName: Run framework quality gate

- powershell: |
    $dest = '$(Build.ArtifactStagingDirectory)\testpackage'
    New-Item -ItemType Directory -Force -Path $dest | Out-Null
    robocopy '$(Build.SourcesDirectory)' $dest /E /R:2 /W:1 /XD .git .vs .idea TestResults Artifacts obj __pycache__
    if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
  displayName: Assemble executable test artifact

- task: PublishPipelineArtifact@1
  displayName: Publish executable test artifact
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)\testpackage'
    artifact: '$(ArtifactName)'

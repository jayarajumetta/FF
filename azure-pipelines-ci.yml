name: $(Date:yyyyMMdd).$(Rev:r)
trigger:
  branches:
    include: [main,sgs/develop]
pr:
  branches:
    include: [main,sgs/develop]

pool:
  vmImage: windows-latest

variables:
  BuildConfiguration: Release
  ArtifactName: testpackage

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: Install .NET 8 SDK
  inputs:
    packageType: sdk
    version: 8.0.x

- task: UsePythonVersion@0
  displayName: Install Python
  inputs:
    versionSpec: '3.11'

- powershell: |
    python --version
    python -m pip install --upgrade pip
    python -m pip install pyyaml
    if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }
  displayName: Install Python dependencies

- powershell: |
    python -B -m unittest discover -s tools -p test_release_reporting.py -v
    if ($LASTEXITCODE -ne 0) { throw 'Release reporting regression tests failed' }
    python -c "import yaml; from pathlib import Path; yaml.safe_load(Path('azure-pipelines-ci.yml').read_text())"
    if ($LASTEXITCODE -ne 0) { throw 'CI YAML validation failed' }
  displayName: Validate distributed report handoff

# - powershell: |
#     python .\tools\package_gate.py
#     if ($LASTEXITCODE -ne 0) { throw 'Client package quality gate failed' }
#   displayName: Run framework quality gate

- powershell: |
    dotnet restore .\ToscaCanonicalSimple.sln
    if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed' }
    dotnet build .\ToscaCanonicalSimple.sln -c $(BuildConfiguration) --no-restore
    if ($LASTEXITCODE -ne 0) { throw 'dotnet build failed' }
  displayName: Restore and build solution

- powershell: |
    $ErrorActionPreference = 'Stop'

    function Get-PlayablePlaywrightScript {
      param([string[]]$Candidates)

      foreach ($candidate in $Candidates | Select-Object -Unique) {
        if (-not (Test-Path -LiteralPath $candidate)) { continue }
        $dll = Join-Path (Split-Path -Parent $candidate) 'Microsoft.Playwright.dll'
        if (Test-Path -LiteralPath $dll) { return $candidate }
      }

      return $null
    }

    $candidateScripts = @(
      "$(Build.SourcesDirectory)\\bin\\InsuranceAutomation.Core\\$(BuildConfiguration)\\net8.0\\playwright.ps1",
      "$(Build.SourcesDirectory)\\bin\\CommercialLines.DuckCreek.Tests\\$(BuildConfiguration)\\net8.0\\playwright.ps1",
      "$(Build.SourcesDirectory)\\bin\\CommercialLines.ExpertQuote.Tests\\$(BuildConfiguration)\\net8.0\\playwright.ps1",
      "$(Build.SourcesDirectory)\\bin\\PersonalLines.DuckCreek.Tests\\$(BuildConfiguration)\\net8.0\\playwright.ps1"
    )

    $playwright = Get-PlayablePlaywrightScript -Candidates $candidateScripts

    if (-not $playwright) {
      Write-Host 'No valid Playwright runtime pair found after solution build. Building CommercialLines.DuckCreek.Tests as fallback...'
      dotnet build .\tests\CommercialLines.DuckCreek.Tests\CommercialLines.DuckCreek.Tests.csproj -c $(BuildConfiguration) --no-restore
      if ($LASTEXITCODE -ne 0) { throw 'Fallback test project build failed' }
      $playwright = Get-PlayablePlaywrightScript -Candidates $candidateScripts
    }

    if (-not $playwright) {
      throw 'No playable playwright.ps1 + Microsoft.Playwright.dll pair was produced by the build outputs.'
    }

    Write-Host "Using Playwright script: $playwright"
    & $playwright install chromium
    if ($LASTEXITCODE -ne 0) { throw 'Playwright browser installation failed' }
  displayName: Validate Playwright browser installation

- powershell: |
    $ErrorActionPreference = 'Stop'
    $binRoot = '$(Build.SourcesDirectory)\bin'
    if (-not (Test-Path -LiteralPath $binRoot -PathType Container)) {
      throw "Shared bin output folder not found: $binRoot"
    }

    $required = @(
      'InsuranceAutomation.Core\$(BuildConfiguration)\net8.0\InsuranceAutomation.Core.dll',
      'CommercialLines.DuckCreek.Tests\$(BuildConfiguration)\net8.0\CommercialLines.DuckCreek.Tests.dll',
      'CommercialLines.ExpertQuote.Tests\$(BuildConfiguration)\net8.0\CommercialLines.ExpertQuote.Tests.dll',
      'PersonalLines.DuckCreek.Tests\$(BuildConfiguration)\net8.0\PersonalLines.DuckCreek.Tests.dll'
    )
    foreach ($relative in $required) {
      $path = Join-Path $binRoot $relative
      if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
        throw "Compiled artifact is missing required output: $path"
      }
    }

    $global:LASTEXITCODE = 0
  displayName: Validate shared bin outputs

- powershell: |
    $ErrorActionPreference = 'Stop'
    $root = '$(Build.SourcesDirectory)'
    $package = '$(Build.ArtifactStagingDirectory)\testpackage'
    New-Item -ItemType Directory -Path $package -Force | Out-Null
    foreach ($directory in @('bin', 'config', 'scripts')) {
      Copy-Item -LiteralPath (Join-Path $root $directory) -Destination (Join-Path $package $directory) -Recurse -Force
    }
    $tools = Join-Path $package 'tools'
    New-Item -ItemType Directory -Path $tools -Force | Out-Null
    foreach ($name in @('release_reporting.py', 'generate_consolidated_report.py')) {
      Copy-Item -LiteralPath (Join-Path $root "tools\$name") -Destination $tools
    }
    foreach ($directory in @('src', 'tests')) {
      Get-ChildItem -LiteralPath (Join-Path $root $directory) -Recurse -File -Filter '*.cs' |
        Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
        ForEach-Object {
          $relative = $_.FullName.Substring($root.Length).TrimStart('\', '/')
          $target = Join-Path $package $relative
          New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force | Out-Null
          Copy-Item -LiteralPath $_.FullName -Destination $target
        }
    }
    python -m py_compile "$tools\release_reporting.py" "$tools\generate_consolidated_report.py"
    if ($LASTEXITCODE -ne 0) { throw 'Reporting tools failed syntax validation' }
  displayName: Package binaries and reporting dependencies

- task: PublishPipelineArtifact@1
  displayName: Publish run-ready test package
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)\testpackage'
    artifact: '$(ArtifactName)'

trigger:
- main
pool:
  vmImage: windows-latest
steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: 8.0.423
- powershell: python tools/quality_gate.py .
  displayName: Static quality gate
- powershell: dotnet build ToscaArtifactAutomation.sln -c Release
  displayName: Restore and build
- powershell: |
    $script = Get-ChildItem -Recurse -Filter playwright.ps1 | Where-Object FullName -Like '*bin*Release*net8.0*' | Select-Object -First 1
    & $script.FullName install msedge
  displayName: Install Playwright Edge
- powershell: dotnet test ToscaArtifactAutomation.sln -c Release --no-build --list-tests
  displayName: Discover tests
- task: PublishPipelineArtifact@1
  condition: always()
  inputs:
    targetPath: $(System.DefaultWorkingDirectory)
    artifact: canonical-framework-evidence

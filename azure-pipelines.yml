trigger:
- main
- develop

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  solution: '**/*.slnx'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: Build
    displayName: 'Build PCFour Application'
    steps:
    
    - task: UseDotNet@2
      displayName: 'Install .NET 10.0 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'
        includePreviewVersions: true

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet packages'
      inputs:
        command: 'restore'
        projects: 'PCFourModernizedNET/**/*.csproj'
        feedsToUse: 'select'

    - task: DotNetCoreCLI@2
      displayName: 'Build solution'
      inputs:
        command: 'build'
        projects: 'PCFourModernizedNET/**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Run tests'
      inputs:
        command: 'test'
        projects: 'PCFourModernizedNET/**/*Tests*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"'
      continueOnError: true

    - task: DotNetCoreCLI@2
      displayName: 'Publish Desktop Application'
      inputs:
        command: 'publish'
        projects: 'PCFourModernizedNET/PCFour.Desktop/PCFour.Desktop.csproj'
        arguments: '--configuration $(buildConfiguration) --framework net10.0-windows --self-contained false --output $(Build.ArtifactStagingDirectory)/Desktop'
        publishWebProjects: false

    - task: CopyFiles@2
      displayName: 'Copy Installer Scripts'
      inputs:
        SourceFolder: 'PCFourModernizedNET/Installer'
        Contents: |
          **/*.iss
          **/*.bat
          **/*.ps1
          **/*.txt
          **/*.md
        TargetFolder: '$(Build.ArtifactStagingDirectory)/Installer'

    - task: CopyFiles@2
      displayName: 'Copy Documentation'
      inputs:
        SourceFolder: 'PCFourModernizedNET'
        Contents: |
          README.md
          INSTALLATION_GUIDE.md
          QUICK_REFERENCE.md
          SampleDuckCreekPolicy.xml
        TargetFolder: '$(Build.ArtifactStagingDirectory)/Documentation'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifacts'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'PCFour-$(Build.BuildNumber)'
        publishLocation: 'Container'

- stage: CreateInstaller
  displayName: 'Create Installer Package'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: Installer
    displayName: 'Build Windows Installer'
    steps:
    
    - task: DownloadBuildArtifacts@0
      displayName: 'Download Build Artifacts'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'PCFour-$(Build.BuildNumber)'
        downloadPath: '$(System.ArtifactsDirectory)'

    # Note: In a real environment, you would install Inno Setup on the build agent
    # or use a custom agent with Inno Setup pre-installed
    
    - task: PowerShell@2
      displayName: 'Prepare Installer Files'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Preparing installer files..."
          
          # Create installer working directory
          $installerDir = "$(System.ArtifactsDirectory)/Installer"
          New-Item -ItemType Directory -Path $installerDir -Force
          
          # Copy published application files
          Copy-Item -Path "$(System.ArtifactsDirectory)/PCFour-$(Build.BuildNumber)/Desktop/*" -Destination "$installerDir/AppFiles" -Recurse -Force
          
          # Copy installer scripts
          Copy-Item -Path "$(System.ArtifactsDirectory)/PCFour-$(Build.BuildNumber)/Installer/*" -Destination "$installerDir/Scripts" -Recurse -Force
          
          Write-Host "Installer files prepared successfully"

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Installer Artifacts'
      inputs:
        pathToPublish: '$(System.ArtifactsDirectory)/Installer'
        artifactName: 'PCFour-Installer-$(Build.BuildNumber)'
        publishLocation: 'Container'

- stage: Release
  displayName: 'Release to Environments'
  dependsOn: 
  - Build
  - CreateInstaller
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployToDev
    displayName: 'Deploy to Development'
    environment: 'PCFour-Development'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Application Artifacts'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'PCFour-$(Build.BuildNumber)'
              downloadPath: '$(Pipeline.Workspace)'

          - task: PowerShell@2
            displayName: 'Deploy to Development Environment'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "Deploying PCFour to Development Environment..."
                
                # In a real scenario, this would deploy to a file share,
                # update an application server, or notify teams of new build availability
                
                $artifactPath = "$(Pipeline.Workspace)/PCFour-$(Build.BuildNumber)"
                Write-Host "Artifact location: $artifactPath"
                
                # Example: Copy to network share (customize for your environment)
                # Copy-Item -Path "$artifactPath/Desktop/*" -Destination "\\server\apps\PCFour\Dev\" -Recurse -Force
                
                Write-Host "Development deployment completed successfully"
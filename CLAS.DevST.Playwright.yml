# Running Playwright Test after CLAS.DEVST is deployed.

trigger: none

pool:
 name: ToscaReleases

variables:
  CI: true

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node.js'

  - powershell: |
      $targets = @(
        "$(System.DefaultWorkingDirectory)/playwright-report",
        "$(System.DefaultWorkingDirectory)/test-results"
      )

      & "$(System.DefaultWorkingDirectory)/Scripts/Cleanup-TestArtifacts.ps1" -TargetPaths $targets
    displayName: 'Pre-Clean Playwright Artifacts'
    condition: always()

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install --with-deps
    displayName: 'Install Playwright browsers'

  - script: npx playwright test
    displayName: 'Run Playwright tests'
    env:
      BASE_URL: $(PW_BASE_URL)
      USERNAME: $(PW_USERNAME)
      PASSWORD: $(PW_PASSWORD)

  - publish: $(System.DefaultWorkingDirectory)/playwright-report
    artifact: playwright-report
    condition: always()

  - powershell: |
      $targets = @(
        "$(System.DefaultWorkingDirectory)/playwright-report",
        "$(System.DefaultWorkingDirectory)/test-results"
      )

      & "$(System.DefaultWorkingDirectory)/Scripts/Cleanup-TestArtifacts.ps1" -TargetPaths $targets
    displayName: 'Post-Publish Playwright Artifact Cleanup'
    condition: always()

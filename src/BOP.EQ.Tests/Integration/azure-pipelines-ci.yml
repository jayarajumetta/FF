trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: 8.x
- script: dotnet restore
  displayName: Restore
- script: dotnet build -c Release --no-restore
  displayName: Build
- script: pwsh bin/Release/net8.0/playwright.ps1 install --with-deps chromium
  displayName: Install browser
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: $(System.DefaultWorkingDirectory)
    artifact: insurance-automation
